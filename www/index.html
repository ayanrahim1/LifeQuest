<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-512.png" sizes="512x512" type="image/png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LifeQuest"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14141c"><title>LifeQuest</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141c;
    --ink-2:#191922;
    --panel:#1e1e2b;
    --panel-2:#262636;
    --border:#34343f;
    --border-soft:#2a2a34;
    --gold:#d9b45c;
    --gold-dim:#a6873f;
    --parchment:#f0e8d8;
    --parchment-dim:#a9a294;
    --steel:#8890a6;
    --ember:#e2643b;
    --good:#6fae62;
    --danger:#d1495b;
    --font-display:'Cinzel',Georgia,serif;
    --font-mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
    --font-body:'Manrope',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{ touch-action:manipulation; } /* blocks pinch-zoom and double-tap-zoom on mobile */
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:var(--font-body);
    min-height:100%;
    padding-inline:16px;
    padding-block:20px 48px;
  }
  h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;text-wrap:balance;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  ::selection{background:var(--gold-dim);color:#14141c;}

  .app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  /* ---------- panel / HUD corner brackets ---------- */
  .panel{
    position:relative;
    background:var(--panel);
    border:1px solid var(--border);
    padding:16px;
  }
  .panel::before,.panel::after{
    content:"";position:absolute;width:10px;height:10px;pointer-events:none;
    border:2px solid var(--gold-dim);opacity:.8;
  }
  .panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}

  /* ---------- header / wordmark ---------- */
  .wordmark{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .wordmark-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .logo-badge{
    width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--ink-2);border:1px solid var(--gold-dim);
    box-shadow:0 0 0 3px rgba(217,180,92,.08), inset 0 0 10px rgba(0,0,0,.5);
    font-family:var(--font-display);font-weight:900;font-size:16px;letter-spacing:.02em;color:var(--gold);
  }
  .wordmark h1{font-size:clamp(22px,5vw,28px);letter-spacing:.04em;color:var(--gold);}
  .wordmark .tag{font-size:11px;color:var(--parchment-dim);letter-spacing:.08em;text-transform:uppercase;}

  /* ---------- overall status plate ---------- */
  .status-plate{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .orb{
    width:78px;height:78px;flex:none;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #3a3a4a, var(--panel-2) 70%);
    border:2px solid var(--gold-dim);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px rgba(217,180,92,.08), inset 0 0 14px rgba(0,0,0,.5);
  }
  .orb .lv-label{font-size:9px;letter-spacing:.12em;color:var(--parchment-dim);text-transform:uppercase;}
  .orb .lv-num{font-family:var(--font-display);font-size:26px;font-weight:900;color:var(--gold);line-height:1;}
  .status-main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;}
  .status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status-title{font-family:var(--font-display);font-size:18px;color:var(--parchment);}
  .grade-badge{
    font-family:var(--font-display);font-weight:900;font-size:13px;
    padding:2px 9px;border:1px solid currentColor;letter-spacing:.03em;
  }
  .g-f{color:#5b5f6e}.g-e{color:#6f7690}.g-d{color:#8a8570}.g-c{color:#a4935f}
  .g-b{color:#c2a755}.g-a{color:var(--gold-dim)}.g-s{color:var(--gold)}
  .g-ss{color:#f5d27a;text-shadow:0 0 8px rgba(245,210,122,.5);}
  .g-sss{
    background:linear-gradient(100deg,#d9b45c,#fff3d0 45%,#d9b45c 65%,#fff3d0);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 3.2s linear infinite;text-shadow:0 0 10px rgba(217,180,92,.35);
    border-color:#f5d27a;
  }
  @keyframes shimmer{to{background-position:-220% 0;}}
  .xp-bar-track{height:8px;background:var(--ink-2);border:1px solid var(--border);position:relative;overflow:hidden;}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .5s ease;}
  .xp-caption{font-family:var(--font-mono);font-size:11px;color:var(--parchment-dim);font-variant-numeric:tabular-nums;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);}
  .tab-btn{
    flex:1;background:transparent;border:none;color:var(--steel);
    padding:10px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
    border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .tab-btn .ic{font-size:16px;}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
  .tab-panel{display:flex;flex-direction:column;gap:14px;}
  .tab-panel[hidden]{display:none;}

  /* ---------- stat grid ---------- */
  .stat-bar-list{display:flex;flex-direction:column;gap:10px;}
  .stat-bar-row{
    display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);
    border-left:4px solid var(--stat-color,var(--gold));padding:14px 16px;cursor:pointer;position:relative;
    font-family:inherit;color:inherit;transition:box-shadow .3s;
  }
  .stat-bar-row::before,.stat-bar-row::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;border:2px solid var(--gold-dim);opacity:.8;}
  .stat-bar-row::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .stat-bar-row::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .stat-bar-row:hover{background:var(--panel-2);}
  .flash{box-shadow:0 0 0 2px var(--stat-color,var(--gold)),0 0 20px var(--stat-color,var(--gold));}
  .stat-bar-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .stat-bar-icon{font-size:22px;flex:none;}
  .stat-bar-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow-wrap:break-word;}
  .stat-bar-lv{font-family:var(--font-mono);font-size:12px;color:var(--parchment-dim);flex:none;}
  .stat-bar-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;gap:8px;flex-wrap:wrap;}
  .stat-bar-bottom .t{font-style:italic;color:var(--parchment-dim);}
  .substat-row{margin-top:10px;}

  /* ---------- quests ---------- */
  .section-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .section-h::after{content:"";flex:1;height:1px;background:var(--border-soft);}
  .quest-bar-row{
    background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--quest-color,var(--gold));
    padding:12px 14px;margin-top:10px;position:relative;
  }
  .quest-bar-row:first-of-type{margin-top:0;}
  .quest-bar-top{display:flex;align-items:center;gap:10px;}
  .quest-bar-icon{font-size:20px;flex:none;}
  .quest-bar-name{font-weight:700;font-size:14px;flex:1;min-width:0;overflow-wrap:break-word;}
  .quest-bar-streak{font-family:var(--font-mono);font-size:11px;color:var(--ember);white-space:nowrap;flex:none;}
  .quest-bar-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;}
  .quest-rewards{display:flex;gap:6px;flex-wrap:wrap;}
  .reward-pill{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border:1px solid var(--pill-color,var(--border));color:var(--pill-color,var(--parchment-dim));}
  .quest-btn{
    flex:none;background:var(--panel-2);border:1px solid var(--gold-dim);color:var(--gold);
    font-weight:700;font-size:12px;padding:7px 12px;white-space:nowrap;
  }
  .quest-btn:hover{background:var(--gold-dim);color:var(--ink);}
  .quest-btn.done{background:transparent;border-color:var(--border);color:var(--steel);}
  .quest-del{background:transparent;border:none;color:var(--steel);font-size:14px;padding:4px 6px;}
  .quest-del:hover{color:var(--danger);}

  /* ---------- log / forms ---------- */
  .chip-cat{background:var(--panel-2);border:1px solid var(--border);color:var(--parchment-dim);padding:6px 12px;font-size:12px;}
  .chip-cat.active{border-color:var(--chip-color,var(--gold));color:var(--chip-color,var(--gold));}
  .category-bar-list{display:flex;flex-direction:column;gap:10px;}
  .category-bar{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-family:inherit;color:inherit;
    background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--tile-color,var(--gold));
    padding:16px 18px;cursor:pointer;
  }
  .category-bar .ic{font-size:26px;flex:none;}
  .category-bar .lbl{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:.04em;color:var(--tile-color,var(--gold));text-transform:uppercase;flex:1;min-width:0;overflow-wrap:break-word;}
  .category-bar .chev{font-size:16px;color:var(--parchment-dim);flex:none;}
  .category-bar:hover{background:var(--panel);border-color:var(--tile-color,var(--gold));}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--steel);margin-bottom:6px;display:block;}
  .text-input,.select-input{
    width:100%;background:var(--ink-2);border:1px solid var(--border);color:var(--parchment);
    padding:9px 10px;font-size:16px;
  }
  /* iOS/Android browsers auto-zoom on focusing a text input whose computed font-size is under
     16px — 13.5px was triggering exactly that. 16px on the input itself kills the zoom without
     needing any JS viewport hacks; visually shrink it back down for wider screens only, since
     mobile is where the auto-zoom rule applies and the field needs to stay at 16px there. */
  @media (min-width:520px){
    .text-input,.select-input{ font-size:13.5px; }
  }
  .form-row{display:flex;flex-direction:column;gap:4px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-primary{
    background:var(--gold);color:#1a1608;border:none;font-weight:800;padding:10px 16px;font-size:13px;
    letter-spacing:.03em;
  }
  .btn-primary:hover{background:#e9c674;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--parchment-dim);padding:8px 14px;font-size:12.5px;}
  .btn-secondary:hover{border-color:var(--steel);color:var(--parchment);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:8px 14px;font-size:12.5px;}
  .btn-danger:hover{background:var(--danger);color:#fff;}

  /* ---------- macros / food / water ---------- */
  .rings-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .rings-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;}
  .ring-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .ring-item svg{overflow:visible;}
  .ring-label{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;}
  .ring-sub{font-size:11px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .calorie-ring .ring-label{font-size:12px;letter-spacing:.08em;}
  .macro-split-bar{display:flex;height:6px;width:100%;margin-top:8px;background:var(--border-soft);overflow:hidden;border-radius:3px;}
  .macro-split-bar span{height:100%;display:block;}
  .macro-split-pct{font-size:10.5px;margin-top:4px;font-family:var(--font-mono);}
  .trend-chart-wrap{display:flex;justify-content:center;margin-bottom:8px;}
  .trend-chart-wrap svg{max-width:100%;}
  .food-input-row{display:flex;gap:8px;flex-wrap:wrap;}
  .food-input-row .text-input{flex:1;min-width:180px;}
  .food-result{margin-top:12px;background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--gold);padding:10px 12px;font-size:12.5px;}
  .food-result-head{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;flex-wrap:wrap;}
  .food-result-head>span:first-child{min-width:0;overflow-wrap:break-word;flex:1;}
  .water-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .water-count{font-family:var(--font-display);font-size:26px;color:#6a86c9;}
  .water-goal{font-size:12px;color:var(--parchment-dim);font-family:var(--font-body);}

  /* ---------- chat ---------- */
  .chat-log{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:2px;}
  /* Without a wrap rule, one long unbroken word/URL in a reply forces this bubble past its
     max-width, which in turn stretches .chat-log and the whole page wider than the viewport —
     that's what was pushing everything typed earlier off to the left as the conversation grew. */
  .chat-msg{max-width:90%;padding:9px 12px;font-size:13px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word;}
  .chat-msg.user{align-self:flex-end;background:var(--gold-dim);color:#1a1608;}
  .chat-msg.assistant{align-self:flex-start;background:var(--panel-2);border:1px solid var(--border);color:var(--parchment);white-space:pre-wrap;}
  .chat-msg.action{align-self:center;background:transparent;border:1px dashed var(--border);color:var(--parchment-dim);font-family:var(--font-mono);font-size:10.5px;text-align:center;padding:4px 10px;}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;align-items:flex-start;}
  .chat-input-row .text-input{flex:1;}
  .chat-textarea{resize:none;overflow-y:hidden;line-height:1.4;max-height:160px;}
  .chat-empty{color:var(--parchment-dim);font-size:12.5px;font-style:italic;padding:10px 0;}
  .chat-cursor{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:text-bottom;animation:chatCursorBlink .9s steps(1,end) infinite;}
  @keyframes chatCursorBlink{ 50%{opacity:0;} }

  /* ---------- workout ---------- */
  .split-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .workout-day{border:1px solid var(--border-soft);padding:10px 12px;margin-top:10px;}
  .workout-day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .workout-day-head .name{font-weight:700;font-size:13.5px;min-width:0;overflow-wrap:break-word;}
  .day-expand-btn{background:transparent;border:none;color:var(--parchment);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .day-expand-btn:hover{color:var(--gold);}
  .day-summary{flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .workout-session{background:var(--panel-2);border:1px solid var(--border-soft);padding:10px 12px;margin-top:10px;}
  .workout-session-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .workout-session-head .name{font-weight:700;font-size:13.5px;min-width:0;overflow-wrap:break-word;}
  .exercise-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
  .exercise-row:last-child{border-bottom:none;}
  .exercise-row span:first-child{min-width:0;overflow-wrap:break-word;flex:1;}
  .exercise-row .meta{font-family:var(--font-mono);color:var(--parchment-dim);white-space:nowrap;flex:none;}
  .split-chip-wrap{display:inline-flex;align-items:stretch;border:1px solid var(--border);}
  .split-chip{background:transparent;border:none;color:var(--parchment-dim);padding:10px 14px;font-size:13px;cursor:pointer;}
  .split-chip-wrap.active{border-color:var(--gold);background:rgba(217,180,92,.08);}
  .split-chip-wrap.active .split-chip{color:var(--gold);font-weight:700;}
  .split-chip-wrap.custom{border-color:#9b7fd4;background:rgba(155,127,212,.07);}
  .split-chip-wrap.custom .split-chip{color:#9b7fd4;}
  .split-chip-wrap.custom.active{border-color:var(--gold);}
  .split-chip-wrap.custom.active .split-chip{color:var(--gold);}
  .split-chip-wrap .quest-del{border-left:1px solid var(--border-soft);padding:4px 8px;}
  .custom-split-btn{border-color:#9b7fd4;color:#9b7fd4;}
  .custom-split-btn:hover{background:rgba(155,127,212,.12);border-color:#9b7fd4;color:#9b7fd4;}
  .custom-split-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-left:3px solid #9b7fd4;background:rgba(155,127,212,.07);padding:8px 10px;flex:1 1 260px;}
  .custom-split-form .text-input{flex:1;min-width:160px;}

  /* ---------- month calendar ---------- */
  .cal-month-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .cal-month-head .btn-secondary{padding:6px 14px;}
  .cal-month-label{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--gold);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow-row{margin-bottom:4px;}
  .cal-dow{text-align:center;font-size:10px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;padding:2px 0;}
  .cal-cell{
    background:var(--ink-2);border:1px solid var(--border-soft);aspect-ratio:1/1;min-height:36px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--parchment-dim);padding:2px;cursor:pointer;
  }
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--gold-dim);color:var(--gold);}
  .cal-cell.selected{border-color:var(--gold);background:rgba(217,180,92,.1);}
  .cal-cell.has-events{color:var(--parchment);}
  .cal-daynum{font-size:12px;font-family:var(--font-mono);}
  .cal-dots{display:flex;gap:2px;align-items:center;justify-content:center;min-height:6px;flex-wrap:wrap;}
  .cal-dot{width:5px;height:5px;border-radius:50%;flex:none;}
  .cal-more{font-size:8px;color:var(--parchment-dim);font-family:var(--font-mono);}

  /* ---------- weekly timetable grid ---------- */
  /* Every hour 6am-10pm still renders at full size — this just caps how tall the panel gets on
     screen, so seeing the rest of a full day means scrolling this box instead of the whole page. */
  .tt-scroll{overflow-x:auto;overflow-y:auto;max-height:380px;}
  .tt-grid{display:flex;min-width:560px;}
  .tt-time-col{flex:none;width:42px;}
  .tt-day-col{flex:1;min-width:70px;border-left:1px solid var(--border-soft);}
  .tt-day-head{height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;z-index:2;background:var(--ink-2);}
  .tt-time-body,.tt-day-body{position:relative;background:var(--ink-2);}
  .tt-hour-label{position:absolute;left:0;right:4px;transform:translateY(-6px);font-size:9px;color:var(--parchment-dim);font-family:var(--font-mono);text-align:right;}
  .tt-day-body{border-top:1px solid var(--border-soft);background-image:repeating-linear-gradient(to bottom, var(--border-soft) 0, var(--border-soft) 1px, transparent 1px, transparent 48px);}
  .tt-block{
    position:absolute;left:2px;right:2px;background:rgba(217,180,92,.14);border:1px solid var(--gold-dim);border-left:3px solid var(--gold);
    padding:3px 5px;overflow:hidden;cursor:pointer;
  }
  .tt-block-title{font-size:10.5px;font-weight:700;color:var(--parchment);line-height:1.2;overflow-wrap:break-word;}
  .tt-block-loc{font-size:9px;color:var(--parchment-dim);margin-top:1px;}
  .tt-unscheduled{display:flex;flex-wrap:wrap;gap:4px;padding:6px 2px;}

<script>
/* =====================================================================
   REPLACEMENT for the Claude Artifact runtime (window.claude).
   This makes the app's AI / save / export features work outside
   Claude, using a free Groq API key via your own Cloudflare Worker.
   Groq's API is OpenAI-compatible, so everything below speaks the
   OpenAI chat-completions shape (messages / tools / tool_calls) —
   NOT Gemini's functionDeclarations/functionCall shape this used to use.

   >>> SET THIS to your deployed Worker's URL before hosting <<<
   ===================================================================== */
(function(){
  "use strict";

  var WORKER_URL = "https://lifequest.ayanrahimsocial.workers.dev"; // <-- your deployed Worker

  // Groq model IDs. Only VISION_MODEL ("complex") can actually see images — the other two are
  // text-only and will error on an image_url content part, so attachImages() below always routes
  // image calls to it regardless of which tier the caller asked for.
  //
  // Groq retires free-tier models with little notice (llama-3.1-8b-instant and
  // llama-3.3-70b-versatile were both deprecated 2026-08-16, a month after these were first
  // picked) — if AI features start failing again with "model_not_found"/404 in the Worker's
  // logs, check https://console.groq.com/docs/models and /docs/deprecations for current IDs.
  var MODEL_MAP = {
    quick: "openai/gpt-oss-20b",
    default: "openai/gpt-oss-120b",
    complex: "qwen/qwen3.6-27b"
  };
  var VISION_MODEL = MODEL_MAP.complex;

  function fileToDataURL(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); }; // already a full "data:<mime>;base64,..." URL
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function toOpenAIMessages(promptOrTurns){
    var turns = (typeof promptOrTurns === "string")
      ? [{ role:"user", content: promptOrTurns }]
      : promptOrTurns;
    return turns.map(function(t){
      var role = (t.role === "assistant") ? "assistant" : (t.role === "system" ? "system" : "user");
      return { role: role, content: t.content };
    });
  }

  // Groq/OpenAI vision format wants the last user message's `content` turned into an array of
  // parts — [{type:"text", text:...}, {type:"image_url", image_url:{url:"data:..."}}] — instead
  // of a plain string.
  function attachImages(messages, images){
    if(!images) return Promise.resolve(messages);
    var files = Array.isArray(images) ? images : [images];
    return Promise.all(files.map(fileToDataURL)).then(function(dataUrls){
      var last = messages[messages.length-1];
      var parts = [{ type:"text", text: (typeof last.content === "string") ? last.content : "" }];
      dataUrls.forEach(function(url){
        parts.push({ type:"image_url", image_url:{ url: url } });
      });
      last.content = parts;
      return messages;
    });
  }

  function postJSON(path, payload, signal){
    return fetch(WORKER_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: signal,
      body: JSON.stringify(payload)
    });
  }

  // Converts the app's tool objects ({name, description, inputSchema, execute}) into OpenAI's
  // tools shape, which Groq speaks natively: {type:"function", function:{name, description, parameters}}.
  function toOpenAIToolDecls(tools){
    return tools.map(function(t){
      return {
        type: "function",
        function: {
          name: t.name,
          description: t.description || "",
          parameters: t.inputSchema || { type:"object", properties:{} }
        }
      };
    });
  }

  // Runs the actual tool-calling round trip against Groq's OpenAI-compatible API: send
  // messages+tools to /generate, and if the reply contains tool_calls, run each matching local
  // tool's execute() (the same function the platform's own sample() would have called), feed its
  // result(s) back as "tool" role messages (matched by tool_call_id), and ask again — repeating
  // until the model replies with plain text instead of more tool_calls. This is the piece the
  // platform runtime does internally; outside Claude nothing does it for you, so it has to happen
  // here or "add to my calendar" never actually touches app state no matter how convincingly the
  // model claims it did.
  function runToolLoop(messages, tools, model, signal, roundsLeft){
    roundsLeft = roundsLeft == null ? 6 : roundsLeft;
    if(roundsLeft <= 0){ return Promise.reject({ code:"refused", message:"Too many tool calls in a row." }); }
    var toolDecls = toOpenAIToolDecls(tools);
    return postJSON("/generate", { model: model, messages: messages, tools: toolDecls }, signal).then(function(r){
      if(r.status === 429) return Promise.reject({ code:"rate_limited" });
      if(!r.ok) return Promise.reject({ code:"refused" });
      return r.json();
    }).then(function(data){
      var calls = data.tool_calls || [];
      if(!calls.length){ return { text: data.text || "" }; }
      var toolResultMessages = calls.map(function(call){
        var name = call.function && call.function.name;
        var args = {};
        try{ args = JSON.parse((call.function && call.function.arguments) || "{}"); }catch(e){}
        var tool = tools.filter(function(t){ return t.name === name; })[0];
        var resultPayload;
        try{
          resultPayload = tool ? tool.execute(args) : { error: "Unknown tool \"" + name + "\"" };
        }catch(e){
          resultPayload = { error: (e && e.message) || String(e) };
        }
        return { role:"tool", tool_call_id: call.id, content: JSON.stringify(resultPayload) };
      });
      var nextMessages = messages.concat([
        { role:"assistant", content: data.text || null, tool_calls: calls }
      ]).concat(toolResultMessages);
      return runToolLoop(nextMessages, tools, model, signal, roundsLeft - 1);
    });
  }

  // The "sample" capability is both callable directly (streaming chat) and
  // has a .json() method (single/multi-turn calls that expect JSON back).
  var sampleCapObj = function(turns, opts){
    opts = opts || {};
    var model = MODEL_MAP[opts.modelTier] || MODEL_MAP.default;
    var messages = toOpenAIMessages(turns);
    // Tool-calling rounds go through the non-streaming /generate endpoint (function calling
    // doesn't fit the SSE text-stream shape /stream is built for) — the UI just shows
    // "Thinking…" until the whole tool-call chain resolves, then the final reply lands in one
    // shot via onText, instead of streaming token-by-token.
    if(opts.tools && opts.tools.length){
      return runToolLoop(messages, opts.tools, model, opts.signal).then(function(res){
        if(opts.onText) opts.onText({ text: res.text });
        return { text: res.text, truncated:false };
      }).catch(function(err){
        if(err && err.name === "AbortError") throw { code:"cancelled" };
        throw (err && err.code) ? err : { code:"refused" };
      });
    }
    return postJSON("/stream", { model: model, messages: messages }, opts.signal).then(function(r){
      if(r.status === 429) return Promise.reject({ code:"rate_limited" });
      if(!r.ok || !r.body) return Promise.reject({ code:"refused" });
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var full = "";
      function pump(){
        return reader.read().then(function(res){
          if(res.done) return { text: full };
          full += decoder.decode(res.value, { stream:true });
          if(opts.onText) opts.onText({ text: full });
          return pump();
        });
      }
      return pump();
    }).catch(function(err){
      if(err && err.name === "AbortError") throw { code:"cancelled" };
      throw (err && err.code) ? err : { code:"refused" };
    });
  };

  sampleCapObj.json = function(promptOrTurns, opts){
    opts = opts || {};
    // A photo forces the vision-capable model regardless of the requested tier — Groq's
    // non-vision models reject image_url content parts outright, so honoring a "quick"/"default"
    // request here would turn every food-photo scan into a hard error instead of an answer.
    var model = opts.images ? VISION_MODEL : (MODEL_MAP[opts.modelTier] || MODEL_MAP.default);
    var messages = toOpenAIMessages(promptOrTurns);
    return attachImages(messages, opts.images).then(function(messages){
      return postJSON("/generate", { model: model, messages: messages, json: true }, opts.signal);
    }).then(function(r){
      if(r.status === 429) return Promise.reject({ code:"rate_limited" });
      if(!r.ok) return Promise.reject({ code:"refused" });
      return r.json();
    }).then(function(data){
      try{ return JSON.parse(data.text); }
      catch(e){ throw { code:"invalid_json" }; }
    });
  };

  sampleCapObj.limits = function(){
    return Promise.resolve({
      images: { mediaTypes: ["image/jpeg","image/png","image/webp"], maxInputBytes: 4*1024*1024 },
      // Real function-calling is implemented above (runToolLoop) — this used to report 0 and
      // relied on a JS truthiness quirk (`if(maxCount)` is false for 0, so the app's own slice
      // never actually ran) to silently pass every tool through anyway, straight into the
      // unconditional rejection that used to sit in sampleCapObj. Reporting a real number here
      // is the honest version of the same effect, now that the rejection is gone.
      tools: { maxCount: 20 }
    });
  };

  // "db" capability — replaces cloud save with localStorage (per-browser only).
  function localDbCap(){
    return {
      doc: function(path){
        var key = "lifequest_doc:" + path;
        return {
          get: function(){
            var raw = null;
            try{ raw = localStorage.getItem(key); }catch(e){}
            return Promise.resolve({
              exists: !!raw,
              data: function(){ return raw ? JSON.parse(raw) : null; }
            });
          },
          set: function(data){
            try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){ return Promise.reject(e); }
            return Promise.resolve();
          }
        };
      }
    };
  }

  // "downloads" capability — replaces it with a plain in-browser file download.
  function localDownloadsCap(){
    return {
      save: function(opts){
        try{
          var blob = new Blob([opts.data], { type:"application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = opts.filename || "backup.json";
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          return Promise.resolve();
        }catch(e){ return Promise.reject(e); }
      }
    };
  }

  window.claude = {
    use: function(name){
      if(name === "sample") return Promise.resolve(sampleCapObj);
      if(name === "db") return Promise.resolve(localDbCap());
      if(name === "downloads") return Promise.resolve(localDownloadsCap());
      if(name === "user") return Promise.resolve({ id: "local-user" });
      return Promise.reject({ code:"not_granted" });
    }
  };
})();
</script>

<script>
(function(){
  "use strict";

  /* ===================== CONFIG ===================== */
  // Bump this on every real update you ship — shown at the bottom of Settings so you can tell
  // at a glance which build is actually installed on a device.
  var APP_VERSION = "1.0.0";
  // The splash screen (the static markup in <div id="app"> at the top of the page) should read
  // as a deliberate beat, not a flash — so the very first render is held back until at least this
  // much time has passed since boot started, even if the save actually loaded faster than that.
  var BOOT_STARTED_AT = Date.now();
  var SPLASH_MIN_MS = 1400;
  // Calibrated for a multi-year arc: ~40 XP/day/stat from consistent daily use (a handful of
  // quests, meals logged, water, an occasional workout) puts level 10 around 2 months in (a real
  // milestone, not trivial) and level 98 around year 7 — the last stretch to 100 then costs
  // roughly as much again as the entire climb to 98, so "maxed out" stays a long-term reach goal.
  var BASE_XP = 250, GROWTH = 1.026, MAX_LEVEL = 100;
  // Bonus XP on top of normal quest rewards: a flat kicker to every stat every N total quest
  // completions (a lifetime-consistency milestone), and a bigger one-time-per-day Discipline
  // bonus for clearing every active daily quest in the same day.
  var QUEST_MILESTONE_EVERY = 10, QUEST_MILESTONE_XP = 25, PERFECT_DAY_XP = 75;
  // Consistency penalty: a day with zero daily-quest completions removes a small amount of XP
  // from every stat; the amount scales with the current run of consecutive missed days (reset the
  // moment a daily quest is completed again), capped so a long dry spell doesn't crater a stat.
  // CONSISTENCY_CHECK_MAX_DAYS bounds how many missed days get replayed (and penalized) in one
  // sitting if the app goes unopened for a long time, so reopening it after months doesn't loop
  // over hundreds of days at once.
  var CONSISTENCY_PENALTY_BASE = 6, CONSISTENCY_PENALTY_MAX = 40, CONSISTENCY_CHECK_MAX_DAYS = 30;
  var GRADES = ["F-","F","F+","E-","E","E+","D-","D","D+","C-","C","C+","B-","B","B+","A-","A","A+","S-","S","S+","SS-","SS","SS+","SSS-","SSS","SSS+"];
  var GRADE_GROUPS = ["f","e","d","c","b","a","s","ss","sss"];
  var TITLES = ["Novice","Initiate","Apprentice","Adept","Journeyman","Specialist","Expert","Veteran","Elite","Master","Grandmaster","Champion","Hero","Paragon","Legend","Mythic","Ascendant","Transcendent","Immortal","Sovereign"];
  var STAT_PALETTE = ["#e2643b","#6fae62","#9b7fd4","#52b8c4","#d99a4e","#6a86c9","#d1495b","#4fb88f","#c77dbb","#7d97d4"];

  var ACTIVITY_MULTIPLIERS = { sedentary:1.2, light:1.375, moderate:1.55, very:1.725, extra:1.9 };
  var ACTIVITY_LABELS = {
    sedentary:"Sedentary (little/no exercise)", light:"Light (1-3 days/wk)", moderate:"Moderate (3-5 days/wk)",
    very:"Very Active (6-7 days/wk)", extra:"Extra Active (training + physical job)"
  };
  var GOAL_ADJUST = { maintain:0, recomp:-200 };
  var GOAL_LABELS = { lose:"Lose Fat", maintain:"Maintain", gain:"Build Muscle", recomp:"Body Recomposition" };
  var PACE_RATES = { lose:{mild:-0.5, moderate:-1, aggressive:-1.5}, gain:{lean:0.25, moderate:0.5} };
  var PACE_LABELS = {
    lose:{mild:"Mild (-0.5 lb/wk)", moderate:"Moderate (-1 lb/wk)", aggressive:"Aggressive (-1.5 lb/wk)"},
    gain:{lean:"Lean (+0.25 lb/wk)", moderate:"Moderate (+0.5 lb/wk)"}
  };
  var DIET_LABELS = {
    none:"No Preference", vegetarian:"Vegetarian", vegan:"Vegan", pescatarian:"Pescatarian",
    keto:"Keto / Low-Carb", paleo:"Paleo", glutenfree:"Gluten-Free", dairyfree:"Dairy-Free"
  };
  var KG_PER_LB = 0.453592, CM_PER_IN = 2.54;

  function defaultProfile(){
    return {
      unit:"imperial", weightKg:72.6, heightCm:172.7, age:30, sex:"male", bodyFatPct:null,
      activity:"moderate", goal:"maintain", pace:"moderate", goalWeightKg:null, diet:"none",
      notes:"", lastPlan:null, onboarded:false
    };
  }
  function paceOptionsHtml(goal, selectedKey){
    var rates = PACE_RATES[goal] || {};
    return Object.keys(rates).map(function(k){
      return '<option value="'+k+'"'+(k===selectedKey?' selected':'')+'>'+PACE_LABELS[goal][k]+'</option>';
    }).join("");
  }
  function computePlan(profile){
    var bf = Number(profile.bodyFatPct);
    var bmr;
    if(isFinite(bf) && bf>0){
      var lbm = profile.weightKg * (1 - bf/100);
      bmr = 370 + 21.6*lbm;
    } else {
      bmr = profile.sex==="female"
        ? (10*profile.weightKg + 6.25*profile.heightCm - 5*profile.age - 161)
        : (10*profile.weightKg + 6.25*profile.heightCm - 5*profile.age + 5);
    }
    var tdee = bmr * (ACTIVITY_MULTIPLIERS[profile.activity] || 1.55);
    var adjust;
    if(profile.goal==="lose" || profile.goal==="gain"){
      var rates = PACE_RATES[profile.goal] || {};
      var rate = rates.hasOwnProperty(profile.pace) ? rates[profile.pace] : (profile.goal==="lose" ? -1 : 0.5);
      adjust = Math.round(rate*500);
    } else {
      adjust = GOAL_ADJUST[profile.goal] || 0;
    }
    var calories = Math.max(1200, Math.round(tdee + adjust));
    var proteinG = Math.round(profile.weightKg * 2.2);
    var fatG = Math.round((calories*0.28)/9);
    var carbG = Math.max(0, Math.round((calories - proteinG*4 - fatG*9)/4));
    return { bmr:Math.round(bmr), tdee:Math.round(tdee), calories:calories, protein:proteinG, carbs:carbG, fat:fatG };
  }

  var EXERCISE_DB = {
    Chest: ["Barbell Bench Press","Incline Barbell Bench Press","Decline Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Dumbbell Flyes","Cable Crossover","Cable Fly (Low-to-High)","Cable Fly (High-to-Low)","Pec Deck Machine","Push-Ups","Dips (Chest Focus)","Machine Chest Press","Smith Machine Bench Press","Landmine Press","Svend Press"],
    Back: ["Deadlift","Pull-Ups","Weighted Pull-Ups","Chin-Ups","Barbell Row","Pendlay Row","Chest-Supported Row","Meadows Row","T-Bar Row","Seated Cable Row","Lat Pulldown","Neutral-Grip Lat Pulldown","Single-Arm Dumbbell Row","Kroc Row","Face Pulls","Straight-Arm Pulldown","Rack Pulls","Hyperextensions"],
    Shoulders: ["Overhead Press","Seated Dumbbell Shoulder Press","Machine Shoulder Press","Arnold Press","Lateral Raise","Cable Lateral Raise","Egyptian Lateral Raise","Front Raise","Rear Delt Flyes","Cable Y-Raise","Upright Row","Shrugs"],
    Biceps: ["Barbell Curl","Dumbbell Curl","Hammer Curl","Preacher Curl","Incline Dumbbell Curl","Cable Curl","Concentration Curl","EZ-Bar Curl","Spider Curl","Drag Curl","21s"],
    Triceps: ["Close-Grip Bench Press","Tricep Pushdown","Overhead Tricep Extension","Skull Crushers","JM Press","Dips (Tricep Focus)","Bench Dips","Cable Kickback","Cable Overhead Extension (Rope)","Diamond Push-Ups"],

  // Pure helper: archives a finished day's totals into a history map keyed by date, capped to
  // the last 90 days so the saved doc stays small. Used both on hydrate (app reopened on a new
  // day) and mid-session (app left open across midnight) so a day's numbers are never silently
  // dropped when nutritionDay rolls over.
  function archiveDayInto(historyObj, day){
    historyObj = historyObj || {};
    if(day && day.date && (day.calories||day.protein||day.carbs||day.fat||day.waterCount)){
      historyObj[day.date] = { calories:day.calories||0, protein:day.protein||0, carbs:day.carbs||0, fat:day.fat||0, waterCount:day.waterCount||0 };
    }
    var dates = Object.keys(historyObj).sort();
    while(dates.length>90){ delete historyObj[dates.shift()]; }
    return historyObj;
  }

      lastConsistencyCheckDate:todayStr(), missStreak:0, consistencyLog:{}
    };
  }

  /* ===================== STATE + PERSISTENCE ===================== */
  // Dropping to pure localStorage (to dodge db's organization-only access restriction, for public
  // sharing) turned out not to work at all: this hosting context doesn't reliably persist
  // localStorage across reloads even in the SAME browser tab — confirmed, not theoretical. db is
  // the only mechanism that actually saves reliably here, so it's back as the primary store;
  // localStorage is kept only as a last-resort fallback for a view where db itself is unavailable
  // (distinct from the org restriction, which blocks the page from loading at all).
  var state = null;
  var docRef = null;
  // On the real Claude platform this flips to false once a synced db doc loads, so the header
  // badge can honestly say "Save synced". In this standalone build the "db" capability (see the
  // window.claude shim above) is just a localStorage wrapper — nothing ever leaves this device —
  // so it stays true always, and the badge always reads "Local save only" instead of implying a
  // backup exists somewhere it doesn't.
  var localOnly = true;
  var writeChain = Promise.resolve();
  var LOCAL_KEY = "lifequest_state_v1";

  // Converts a split saved by an older version (flat, arbitrarily-named days) into the
  // current Sunday-Saturday shape, spreading old days across weekdays starting Monday.
  function migrateSplit(oldSplit){
    if(oldSplit && oldSplit.days && oldSplit.days.length && oldSplit.days[0] && oldSplit.days[0].weekday){
      return oldSplit;
    }
    var days = freshWeekDays();
    var order = [1,2,3,4,5,6,0]; // Mon..Sat, Sun
    var oldDays = (oldSplit && Array.isArray(oldSplit.days)) ? oldSplit.days : [];
    oldDays.forEach(function(od, i){
      var day = days[order[i % 7]];
      day.rest = false;
      day.workouts.push({
        id:"wk_"+uid().slice(0,8),
        name: od.name || "Workout",
        exercises: (od.exercises||[]).map(function(e){ return {name:e.name, sets:e.sets, reps:e.reps}; })
      });
    });
    return { id: (oldSplit&&oldSplit.id) || ("split_"+uid().slice(0,8)), name: (oldSplit&&oldSplit.name) || "Split", days:days };
  }

  function hydrate(loaded){
    loaded = loaded || {};
    var stats = (loaded.stats && loaded.stats.length) ? loaded.stats : defaultStats();
    var quests = (loaded.quests && loaded.quests.length) ? loaded.quests : defaultQuests();
    stats.forEach(function(s){
      s.level = s.level || 1; s.xp = s.xp || 0; s.totalXp = s.totalXp || 0;
      s.icon = s.icon || "🔹"; s.color = s.color || "#d9b45c";
      if(!Array.isArray(s.substats) || s.substats.length!==4){
        s.substats = makeSubstats(STAT_SUBSTATS[s.id] || genericSubstatNames());
      }
    });
    quests.forEach(function(q){
      q.streak = q.streak || 0; q.lastCompleted = q.lastCompleted || null; q.done = !!q.done;
      q.rewards = q.rewards || {};
    });
    var settings = Object.assign(defaultSettings(), loaded.settings||{});
    var nutritionHistory = (loaded.nutritionHistory && typeof loaded.nutritionHistory==="object") ? loaded.nutritionHistory : {};
    var nutritionDay;
    if(loaded.nutritionDay && loaded.nutritionDay.date===todayStr()){
      nutritionDay = loaded.nutritionDay;
    } else {
      nutritionHistory = archiveDayInto(nutritionHistory, loaded.nutritionDay);
      nutritionDay = freshNutritionDay();
    }
    var profile = Object.assign(defaultProfile(), loaded.profile||{});
    if(!profile.onboarded && loaded.profile && loaded.profile.lastPlan){ profile.onboarded = true; }
    var chat = Object.assign(defaultChat(), loaded.chat||{});
    var workout = Object.assign(defaultWorkout(), loaded.workout||{});
    workout.splits = (workout.splits||[]).map(migrateSplit);
    var calendar = Object.assign(defaultCalendar(), loaded.calendar||{});
    calendar.events = Array.isArray(calendar.events) ? calendar.events : [];
    if(!Array.isArray(calendar.timetable) || calendar.timetable.length!==7 || !calendar.timetable[0] || !calendar.timetable[0].weekday){
      calendar.timetable = freshTimetableDays();
    }
    var recipes = (Array.isArray(loaded.recipes) ? loaded.recipes : []).map(function(r){
      if(!r.servingsCustom) r.servings = 1;
      return r;
    });
    var recipeIngredients = Array.isArray(loaded.recipeIngredients) ? loaded.recipeIngredients : [];
    // A save from before this feature existed has no lastConsistencyCheckDate — default it to
    // today (not the account's creation date) so history predating this feature is never
    // retroactively penalized; the very first check then simply has nothing to look back over.
    var consistencyLog = (loaded.consistencyLog && typeof loaded.consistencyLog==="object") ? loaded.consistencyLog : {};
    return {
      version:1, stats:stats, quests:quests, log:loaded.log||[], settings:settings, nutritionDay:nutritionDay,
      nutritionHistory:nutritionHistory, profile:profile, chat:chat, workout:workout, calendar:calendar,
      recipes:recipes, recipeIngredients:recipeIngredients, createdAt:loaded.createdAt||new Date().toISOString(),
      questsCompletedTotal:loaded.questsCompletedTotal||0, lastPerfectDayDate:loaded.lastPerfectDayDate||null,
      lastConsistencyCheckDate:loaded.lastConsistencyCheckDate||todayStr(), missStreak:loaded.missStreak||0, consistencyLog:consistencyLog
    };
  }
  function ensureNutritionDay(){
    if(!state.nutritionDay || state.nutritionDay.date !== todayStr()){
      state.nutritionHistory = archiveDayInto(state.nutritionHistory, state.nutritionDay);
      state.nutritionDay = freshNutritionDay();
    }
  }
  function numOr(v,d){ v=Number(v); return isFinite(v) && v>=0 ? v : d; }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  function saveLocal(){
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
  }
  function loadLocal(){
    try{ var raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }

  function persist(){
    writeChain = writeChain.then(function(){
      if(docRef){ return docRef.set(state); }
      saveLocal();
    }).catch(function(){
      // The toast below promises a local backup, so actually write one — a failed db write
      // otherwise left nothing saved anywhere despite the message implying it had a fallback.
      try{ saveLocal(); }catch(e){}
      showToast("⚠️","Sync issue","Progress kept locally, will retry next change.");
    });
    return writeChain;
  }

  /* ===================== XP / LEVEL LOGIC ===================== */
  function addSubXp(sub, amount){
    sub.totalXp = (sub.totalXp||0) + amount;
    if(sub.level >= MAX_LEVEL) return;
    sub.xp += amount;
    while(sub.level < MAX_LEVEL){
      var need = xpToNext(sub.level);
      if(sub.xp < need) break;
      sub.xp -= need;
      sub.level += 1;
      if(sub.level >= MAX_LEVEL){ sub.xp = 0; break; }
    }
  }

  // Turns keyword hits in `text` into a {substatName: weight} map for the given stat, so a text-only
  // XP source (a quest name, an event title) still lands on the substat(s) it actually describes.
  // Returns null if the stat has no keyword dictionary or nothing in the text matched — callers
  // should fall back to an even split in that case rather than silently dropping XP.
  function keywordSubstatWeights(stat, text){
    var dict = SUBSTAT_KEYWORDS[stat.id];
    if(!dict || !text) return null;
    var lower = text.toLowerCase();
    var weights = {}; var any = false;
    (stat.substats||[]).forEach(function(sub){
      var kws = dict[sub.name];
      if(!kws) return;
      var hits = 0;
      kws.forEach(function(kw){ if(lower.indexOf(kw)!==-1) hits++; });
      if(hits>0){ weights[sub.name] = hits; any = true; }
    });
    return any ? weights : null;
  }
  // A fixed bias toward specific substat(s) by name, e.g. workout completion should mostly move
  // "Follow-Through" rather than an even quarter to every discipline substat.
  function biasedWeights(stat, primaryNames, primaryShare){
    var names = (stat.substats||[]).map(function(s){ return s.name; });
    var primary = names.filter(function(n){ return primaryNames.indexOf(n)!==-1; });
    if(!primary.length) return null;
    var rest = names.filter(function(n){ return primaryNames.indexOf(n)===-1; });
    var weights = {};
    var eachPrimary = primaryShare / primary.length;
    primary.forEach(function(n){ weights[n] = eachPrimary; });
    if(rest.length){
      var eachRest = (1-primaryShare) / rest.length;
      rest.forEach(function(n){ weights[n] = eachRest; });
    }
    return weights;
  }
  // Blends the actual logged macros/health score with any keyword hints in the food name/note, so
  // e.g. a protein-heavy meal moves "Protein Intake"/"Meal Quality" and leaves "Hydration" alone —
  // hydration only moves from actually logging water (see logWater).
  function nutritionSubstatWeights(foodName, note, cal, pro, health){
    var weights = { "Protein Intake":0, "Meal Quality":0, "Hydration":0, "Portion Control":0 };
    var proteinCalRatio = cal>0 ? clamp((pro*4)/cal, 0, 1) : 0;
    weights["Protein Intake"] += proteinCalRatio * 3;
    weights["Meal Quality"] += (health/100) * 2;
    var idealMeal = (state.settings.calorieTarget || 2000) / 4;
    var deviation = idealMeal>0 ? Math.abs(cal-idealMeal)/idealMeal : 0;
    weights["Portion Control"] += Math.max(0, 1 - Math.min(1, deviation));
    var text = ((foodName||"")+" "+(note||"")).toLowerCase();
    var dict = SUBSTAT_KEYWORDS.nutrition;
    Object.keys(dict).forEach(function(subName){
      dict[subName].forEach(function(kw){ if(text.indexOf(kw)!==-1) weights[subName] += 1; });
    });
    var total = weights["Protein Intake"]+weights["Meal Quality"]+weights["Hydration"]+weights["Portion Control"];
    return total>0 ? weights : null;
  }
  // Guesses Strength/Endurance/Mobility from exercise names in the completed workout; Recovery
  // always gets a small flat share since simply finishing a session aids recovery either way.
  function fitnessSubstatWeights(exercises){
    if(!exercises || !exercises.length) return null;
    var weights = { Strength:0, Endurance:0, Mobility:0, Recovery:1 };
    var dict = SUBSTAT_KEYWORDS.fitness;
    exercises.forEach(function(ex){
      var text = (ex.name||"").toLowerCase();
      var repNum = parseInt(ex.reps,10)||0;
      var matched = false;
      ["Endurance","Mobility","Strength"].forEach(function(subName){
        dict[subName].forEach(function(kw){ if(text.indexOf(kw)!==-1){ weights[subName] += 2; matched = true; } });
      });
      if(!matched){ weights[repNum>=15 ? "Endurance" : "Strength"] += 2; }
    });
    return weights;
  }
  // Resolves `context` (an explicit {substatName:weight} map, a text string to keyword-match, or
  // nothing) into the weights addXp should use, falling back to an even split when no signal exists.
  function resolveSubWeights(stat, context){
    var names = (stat.substats||[]).map(function(s){ return s.name; });
    if(!names.length) return null;
    var weights = null;
    if(context && typeof context === "object"){ weights = context; }
    else if(typeof context === "string"){ weights = keywordSubstatWeights(stat, context); }
    if(!weights){
      weights = {};
      names.forEach(function(n){ weights[n] = 1; });
    }
    return weights;
  }
  // Quests carry an explicit subBias (set at creation time — hand-picked for the static catalog,
  // AI-picked for generated ones) naming exactly which substat they're about; that's always more
  // accurate than guessing from the quest's name, so prefer it and only fall back to keyword
  // matching on the name for older quests saved before subBias existed.
  function questXpContext(q, statId){
    var subName = q.subBias && q.subBias[statId];
    if(subName){ var w = {}; w[subName] = 1; return w; }
    return q.name;
  }
  function addXp(stat, amount, context){
    var events = [];
    stat.totalXp = (stat.totalXp||0) + amount;
    if(stat.level < MAX_LEVEL){
      stat.xp += amount;
      while(stat.level < MAX_LEVEL){
        var need = xpToNext(stat.level);
        if(stat.xp < need) break;
        stat.xp -= need;
        var oldTIdx = titleIndex(stat.level);
        stat.level += 1;
        var newTIdx = titleIndex(stat.level);
        events.push({ level:stat.level, newTitle: (newTIdx!==oldTIdx) ? TITLES[newTIdx] : null });
        if(stat.level >= MAX_LEVEL){ stat.xp = 0; break; }
      }
    }
    if(Array.isArray(stat.substats) && stat.substats.length){
      var weights = resolveSubWeights(stat, context);
      var total = 0;
      stat.substats.forEach(function(sub){ total += Math.max(0, weights[sub.name]||0); });
      if(total>0){
        stat.substats.forEach(function(sub){
          var w = Math.max(0, weights[sub.name]||0);
          if(w>0) addSubXp(sub, amount * (w/total));
        });
      }
    }
    return events;
  }

  // Inverse of addSubXp: removes XP, borrowing down through previous levels when a substat's xp
  // goes negative (the mirror image of leveling up), and floors at level 1 / 0 xp.
  function removeSubXp(sub, amount){
    amount = Math.max(0, amount||0);
    if(amount<=0) return;
    sub.totalXp = Math.max(0, (sub.totalXp||0) - amount);
    sub.xp -= amount;
    while(sub.xp < 0 && sub.level > 1){
      sub.level -= 1;
      sub.xp += xpToNext(sub.level);
    }
    if(sub.xp < 0) sub.xp = 0;
  }
  // Inverse of addXp, used by the consistency penalty. A stat at MAX_LEVEL has xp pinned at 0
  // (addXp stops accumulating there), so removing XP delevels it below MAX_LEVEL the same way
  // any other level-down does — there's no special case needed for a maxed stat here.
  function removeXp(stat, amount){
    amount = Math.max(0, amount||0);
    if(amount<=0) return;
    stat.totalXp = Math.max(0, (stat.totalXp||0) - amount);
    stat.xp -= amount;
    while(stat.xp < 0 && stat.level > 1){
      stat.level -= 1;
      stat.xp += xpToNext(stat.level);
    }
    if(stat.xp < 0) stat.xp = 0;
    if(Array.isArray(stat.substats) && stat.substats.length){
      var each = amount / stat.substats.length;
      stat.substats.forEach(function(sub){ removeSubXp(sub, each); });
    }
  }

  function computeOverall(){
    var stats = state.stats;
    if(!stats.length) return { level:1, frac:0, xpToNextFrac:1 };
    var sum = 0;
    stats.forEach(function(s){
      if(s.level >= MAX_LEVEL){ sum += MAX_LEVEL; }
      else { sum += s.level + (s.xp / xpToNext(s.level)); }
    });
    var frac = sum / stats.length;
    var level = Math.max(1, Math.min(MAX_LEVEL, Math.floor(frac)));
    var progress = level >= MAX_LEVEL ? 1 : (frac - level);
    return { level:level, progress:progress };
  }

  /* ===================== LOG ===================== */
  // `meta` is optional extra data a log entry needs to be cleanly reversible beyond its stat XP —
  // currently just the nutrition macros a food/recipe log added, so unlogEntry() can subtract
  // them back out of today's totals (see applyNutritionEvent).
  function addLogEntry(text, rewards, meta){
    state.log.unshift({ id:uid(), ts:Date.now(), text:text, rewards:rewards||{}, meta:meta||null });
    if(state.log.length > 150) state.log.length = 150;
  }

  // Reverses a log entry's stat XP (and, for a same-day food/recipe log, its macros) and removes
  // it from the feed. Quest/workout/event "completed" flags are left as-is — this undoes what the
  // entry rewarded, not which specific quest it came from, so re-completing something is still a
  // normal completion rather than this button trying to guess which quest to reopen.
  function unlogEntry(logId){
    var idx = -1;
    state.log.forEach(function(e, i){ if(e.id===logId) idx = i; });
    if(idx===-1) return;
    var entry = state.log[idx];
    var affected = [];
    Object.keys(entry.rewards||{}).forEach(function(statId){
      var amt = entry.rewards[statId];
      var stat = statById(statId);
      if(!stat || !amt) return;
      if(amt >= 0){ removeXp(stat, amt); } else { addXp(stat, -amt, entry.text); }
      affected.push(statId);
    });
    var partialMacros = false;
    var isToday = todayStr(new Date(entry.ts))===todayStr();
    if(isToday){
      if(entry.meta && entry.meta.nutrition){
        ensureNutritionDay();
        var n = entry.meta.nutrition;
        state.nutritionDay.calories = Math.max(0, state.nutritionDay.calories - (n.cal||0));
        state.nutritionDay.protein = Math.max(0, state.nutritionDay.protein - (n.pro||0));
        state.nutritionDay.carbs = Math.max(0, state.nutritionDay.carbs - (n.carb||0));
        state.nutritionDay.fat = Math.max(0, state.nutritionDay.fat - (n.fat||0));
      } else {
        // A food/recipe log made before entries stored their exact macros only has calories and
        // protein recoverable — they're the two numbers baked into the log line itself
        // ("… — 480 cal, 32g protein …"); carbs and fat were never recorded anywhere for it.
        var m = /(\d+)\s*cal,\s*(\d+)g protein/.exec(entry.text);
        if(m){
          ensureNutritionDay();
          state.nutritionDay.calories = Math.max(0, state.nutritionDay.calories - Number(m[1]));
          state.nutritionDay.protein = Math.max(0, state.nutritionDay.protein - Number(m[2]));
          partialMacros = true;
        }
      }
    }
    state.log.splice(idx, 1);
    render(); persist();
    if(affected.length) flashStatIds(affected);
    showToast("↩️","Un-logged", partialMacros
      ? "XP reversed. This meal predates exact macro tracking, so only calories/protein were adjusted back — carbs and fat couldn't be recovered."
      : "That entry's XP was reversed and removed from your feed.");
  }

  function statById(id){ return state.stats.filter(function(s){return s.id===id;})[0]; }

  /* ===================== DAILY CONSISTENCY ===================== */
  // consistencyLog[dateStr] = true is written the moment any daily quest is completed on that
  // date (see completeQuest) — that's the durable, unambiguous record of "was this day
  // consistent", rather than trying to reconstruct it after the fact from quest.lastCompleted
  // (which only remembers each quest's most recent date, not its full history) or from parsing
  // Activity Feed text.
  function applyConsistencyPenalty(dateStr, missStreak){
    var perStat = Math.min(CONSISTENCY_PENALTY_MAX, CONSISTENCY_PENALTY_BASE * missStreak);
    if(perStat<=0) return;
    var rewards = {};
    state.stats.forEach(function(s){
      removeXp(s, perStat);
      rewards[s.id] = -perStat;
    });
    var dayLabel;
    try{ dayLabel = new Date(dateStr+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}); }catch(e){ dayLabel = dateStr; }
    var streakNote = missStreak>1 ? (" — "+missStreak+" days in a row") : "";
    addLogEntry("📉 No daily quests completed "+dayLabel+streakNote, rewards);
  }

  // Walks every FULL day between the last check and today (today is always left alone — it isn't
  // over yet), penalizing any day with zero daily-quest completions and resetting the streak on
  // any day that had at least one. Runs once per boot, so it catches up on everything missed
  // since the app was last opened, capped at CONSISTENCY_CHECK_MAX_DAYS to keep a long-dormant
  // save from replaying hundreds of days at once.
  function checkDailyConsistency(){
    if(!state.lastConsistencyCheckDate){ state.lastConsistencyCheckDate = todayStr(); return; }
    var today = todayStr();
    if(state.lastConsistencyCheckDate >= today) return;
    var hasDailyQuests = state.quests.some(function(q){ return q.freq==="daily"; });
    var cursor = new Date(state.lastConsistencyCheckDate+"T00:00:00");
    var processed = 0;
    while(processed < CONSISTENCY_CHECK_MAX_DAYS){
      cursor.setDate(cursor.getDate()+1);
      var dateStr = todayStr(cursor);
      if(dateStr >= today) break;
      var wasConsistent = !!state.consistencyLog[dateStr];
      if(wasConsistent){
        state.missStreak = 0;
      } else if(hasDailyQuests){
        state.missStreak = (state.missStreak||0) + 1;
        applyConsistencyPenalty(dateStr, state.missStreak);
      }
      delete state.consistencyLog[dateStr];
      processed++;
    }
    state.lastConsistencyCheckDate = today;
  }

  /* ===================== ACTIONS ===================== */
  var pendingToasts = [];

  function completeQuest(qId){
    var q = state.quests.filter(function(x){return x.id===qId;})[0];
    if(!q) return;
    var today = todayStr();
    if(q.freq === "daily"){
      if(q.lastCompleted === today) return;
      q.streak = (q.lastCompleted === yesterdayStr()) ? (q.streak||0)+1 : 1;
      q.lastCompleted = today;
      state.consistencyLog[today] = true;
    } else if(q.freq === "once"){
      if(q.done) return;
      q.done = true;
    }
    var events = [];
    Object.keys(q.rewards).forEach(function(statId){
      var amt = q.rewards[statId];
      var stat = statById(statId);
      if(stat){ addXp(stat, amt, questXpContext(q, statId)).forEach(function(e){ events.push({stat:stat, level:e.level, newTitle:e.newTitle}); }); }
    });
    addLogEntry(q.icon + " " + q.name, q.rewards);
    flashStat(q.rewards);

    state.questsCompletedTotal = (state.questsCompletedTotal||0) + 1;
    if(state.questsCompletedTotal % QUEST_MILESTONE_EVERY === 0){
      var milestoneRewards = {};
      state.stats.forEach(function(s){
        milestoneRewards[s.id] = QUEST_MILESTONE_XP;
        addXp(s, QUEST_MILESTONE_XP, biasedWeights(s, ["Consistency"], 1)).forEach(function(e){ events.push({stat:s, level:e.level, newTitle:e.newTitle}); });
      });
      addLogEntry("🎉 Milestone — "+state.questsCompletedTotal+" quests completed", milestoneRewards);
      flashStatIds(state.stats.map(function(s){ return s.id; }));
      showToast("🎉","Milestone!", state.questsCompletedTotal+" quests completed — +"+QUEST_MILESTONE_XP+" bonus XP to every stat.");
    }
    if(q.freq==="daily"){
      var dailies = state.quests.filter(function(x){ return x.freq==="daily"; });
      if(dailies.length && dailies.every(function(x){ return x.lastCompleted===today; }) && state.lastPerfectDayDate!==today){
        state.lastPerfectDayDate = today;
        var disc = statById("discipline");
        if(disc){
          addXp(disc, PERFECT_DAY_XP, biasedWeights(disc, ["Consistency"], 1)).forEach(function(e){ events.push({stat:disc, level:e.level, newTitle:e.newTitle}); });
          addLogEntry("🌟 Perfect Day — every daily quest completed", {discipline:PERFECT_DAY_XP});
          flashStatIds(["discipline"]);
          showToast("🌟","Perfect Day!","All daily quests complete — +"+PERFECT_DAY_XP+" bonus Discipline XP.");
        }
      }
    }

    render();
    persist();
    events.forEach(function(e){ queueLevelToast(e.stat, e.level, e.newTitle); });
    flushToasts();
  }

  function deleteQuest(qId){
    state.quests = state.quests.filter(function(q){return q.id!==qId;});
    render(); persist();
  }

  /* ----- AI food analysis ----- */
  var sampleCap = null;
  var sampleLimits = null;
  var foodAnalyzing = false;
  var foodError = null;
  var lastFoodResult = null;
  var pendingFoodImage = null;
  var pendingFoodImageUrl = null;

  function errorCopy(err){
    var code = err && err.code;
    if(code==="not_granted") return "AI access isn't enabled for this app — you can still track water and quests.";
    if(code==="rate_limited") return "Too many requests right now — try again in a moment.";
    if(code==="invalid_json") return "Couldn't read the estimate — try rephrasing.";
    if(code==="refused") return "Couldn't analyze that — try different wording or a clearer photo.";
    if(code==="image_rejected") return "That photo couldn't be used — try a different image.";
    if(code==="images_unavailable") return "Photo analysis isn't available in this view.";
    if(code==="tools_unavailable") return "App actions aren't supported in this view — plain chat still works.";
    if(code==="sampling_disabled") return "AI isn't available for this account right now.";
    if(code==="session_expired") return "Please sign in again to continue.";
    if(code==="prompt_too_large") return "That's too long — try something shorter.";
    if(code==="empty_completion") return "AI didn't return anything — try rephrasing.";
    if(code==="cancelled") return null;
    return "Something went wrong" + (code ? " (" + code + ")" : "") + " — try again.";
  }

  function handlePhotoPicked(file){
    if(!file) return;
    if(sampleLimits && sampleLimits.images){

  function applyNutritionEvent(foodName, cal, pro, carb, fat, health, note, iconPrefix){
    ensureNutritionDay();
    state.nutritionDay.calories += cal;
    state.nutritionDay.protein += pro;
    state.nutritionDay.carbs += carb;
    state.nutritionDay.fat += fat;

    var nutritionXp = Math.round(10 + health * 0.2);
    var disciplineXp = health >= 70 ? 15 : (health >= 45 ? 5 : 0);

    var rewards = {}; var events = [];
    var nut = statById("nutrition");
    if(nut){ rewards.nutrition = nutritionXp; addXp(nut, nutritionXp, nutritionSubstatWeights(foodName, note, cal, pro, health)).forEach(function(e){ events.push({stat:nut, level:e.level, newTitle:e.newTitle}); }); }
    var disc = statById("discipline");
    if(disc && disciplineXp > 0){ rewards.discipline = disciplineXp; addXp(disc, disciplineXp, biasedWeights(disc, ["Willpower"], 0.7)).forEach(function(e){ events.push({stat:disc, level:e.level, newTitle:e.newTitle}); }); }

    var logText = (iconPrefix||"🍽️ ") + foodName + " — " + Math.round(cal) + " cal, " + Math.round(pro) + "g protein" + (note ? " · " + note : "");
    addLogEntry(logText, rewards, {nutrition:{cal:cal, pro:pro, carb:carb, fat:fat}});

    flashStatIds(Object.keys(rewards));
    events.forEach(function(e){ queueLevelToast(e.stat, e.level, e.newTitle); });
    flushToasts();

    return { food:foodName, cal:cal, pro:pro, carb:carb, fat:fat, health:health, note:note, nutritionXp: nut?nutritionXp:0, disciplineXp: (disc&&disciplineXp>0)?disciplineXp:0 };
  }

  function applyFoodResult(rawText, data){

      instructions: Array.isArray(data.instructions) ? data.instructions.map(function(i){ return String(i).slice(0,300); }) : ((fallback&&fallback.instructions)||[]),
      calories: numOr(data.calories_per_serving, fallback?fallback.calories:0),
      protein: numOr(data.protein_g_per_serving, fallback?fallback.protein:0),
      carbs: numOr(data.carbs_g_per_serving, fallback?fallback.carbs:0),

    render();

      ? (" Use primarily these ingredients the user already has: " + state.recipeIngredients.join(", ") + ". Assume "
        + "basic staples (salt, pepper, cooking oil, common spices) are available too — it's fine to need 1-2 extra items, but prioritize what's listed.")
      : "";
    var prompt = "You are a recipe developer inside a nutrition app. The user wants: \"" + idea + "\"." + dietNote + ingredientNote
      + " Their goal is " + (GOAL_LABELS[p.goal]||p.goal) + ".\n"
      + "Create a complete, practical recipe. Reply with ONLY a JSON object, no other text, in exactly this shape:\n"

      + "ingredients should include quantities (e.g. \"2 cups cooked rice\"). instructions should be clear numbered steps, one per array item. healthScore is 0-100 (whole/balanced scores high, ultra-processed/sugary scores low).";

  // Editing a saved (or just-generated) recipe is a mini chat: the user describes any change in
  // plain language, Claude replies conversationally AND returns the updated recipe each turn.
  function sendRecipeChatMessage(text){
    text = (text||"").trim();
    if(!text || !sampleCap || recipeGenerating || !pendingRecipe) return;
    recipeGenerating = true; recipeError = null;
    recipeChatHistory.push({role:"user", content:text});
    render();
    var r = pendingRecipe;
    var current = { name:r.name, servings:r.servings, ingredients:r.ingredients, instructions:r.instructions, calories_per_serving:r.calories, protein_g_per_serving:r.protein, carbs_g_per_serving:r.carbs, fat_g_per_serving:r.fat, healthScore:r.healthScore };
    var intro = "You are a friendly recipe assistant chatting with the user about one specific recipe. Understand "
      + "any request naturally — ingredient swaps, rescaling to a different serving count, dietary changes, "
      + "simplifying steps, substitution questions, anything. Always work from the CURRENT recipe state given here "
      + "(ignore anything different from earlier in the conversation): " + JSON.stringify(current) + "\n\n"
      + "Reply with ONLY a JSON object, no other text: "
      + '{"reply": string (short, friendly, at most 2 sentences), "recipe": {"name": string, "servings": number, "ingredients": [string], "instructions": [string], "calories_per_serving": number, "protein_g_per_serving": number, "carbs_g_per_serving": number, "fat_g_per_serving": number, "healthScore": number}}\n'
      + 'If the user asked a question rather than requesting a change, answer it in "reply" and return the recipe unchanged.';
    var turns = [{role:"user", content:intro}].concat(recipeChatHistory);
    sampleCap.json(turns, {modelTier:"default"}).then(function(data){
      recipeGenerating = false;
      data = data || {};
      pendingRecipe = recipeShapeFromData(data.recipe, r, true);
      recipeChatHistory.push({role:"assistant", content:(data.reply||"Updated the recipe.").toString().slice(0,400)});
      render();
    }).catch(function(err){
      recipeGenerating = false;
      recipeChatHistory.pop();
      recipeError = errorCopy(err);
      render();
    });
  }
  function recipeChatLogHtml(){
    var msgs = recipeChatHistory.map(function(m){

      return '<div class="chat-msg assistant">'+escapeHtml(m.content)+'</div>';
    }).join("");
    return msgs || '<div class="chat-empty">Ask for any change — swap an ingredient, adjust servings, make it vegan, anything.</div>';

  /* ----- Profile ----- */
  function applyProfileVals(vals){
    var unit = state.profile.unit;
    var weightKg, heightCm, goalWeightKg;
    if(unit==="imperial"){
      weightKg = clamp(parseFloat(vals.weight)||0, 50, 600) * KG_PER_LB;
      var ft = parseFloat(vals.heightFt)||0, inch = parseFloat(vals.heightIn)||0;
      heightCm = clamp(ft*12+inch, 24, 96) * CM_PER_IN;
      goalWeightKg = (vals.goalWeight && parseFloat(vals.goalWeight)>0) ? clamp(parseFloat(vals.goalWeight),50,600)*KG_PER_LB : null;
    } else {
      weightKg = clamp(parseFloat(vals.weight)||0, 20, 300);
      heightCm = clamp(parseFloat(vals.height)||0, 60, 250);
      goalWeightKg = (vals.goalWeight && parseFloat(vals.goalWeight)>0) ? clamp(parseFloat(vals.goalWeight),20,300) : null;
    }
    state.profile.weightKg = weightKg;
    state.profile.heightCm = heightCm;
    state.profile.goalWeightKg = goalWeightKg;
    state.profile.age = clamp(parseInt(vals.age,10)||state.profile.age, 13, 100);
    state.profile.sex = vals.sex==="female" ? "female" : "male";
    var bf = parseFloat(vals.bodyFat);
    state.profile.bodyFatPct = (isFinite(bf) && bf>0) ? clamp(bf,3,60) : null;
    state.profile.activity = ACTIVITY_MULTIPLIERS.hasOwnProperty(vals.activity) ? vals.activity : "moderate";
    state.profile.goal = GOAL_LABELS.hasOwnProperty(vals.goal) ? vals.goal : "maintain";
    state.profile.pace = vals.pace || state.profile.pace || "moderate";
    state.profile.diet = DIET_LABELS.hasOwnProperty(vals.diet) ? vals.diet : "none";
    state.profile.notes = (vals.notes||"").slice(0,300);

    var plan = computePlan(state.profile);
    state.profile.lastPlan = plan;
    state.settings.calorieTarget = plan.calories;
    state.settings.proteinTarget = plan.protein;
    state.settings.carbsTarget = plan.carbs;
    state.settings.fatTarget = plan.fat;
  }

  function findSplit(idOrName){

  }
  function findDay(split, weekday){
    return split.days.filter(function(d){ return d.weekday===weekday; })[0];

    return day.workouts.filter(function(w){ return w.id===workoutId; })[0];
  }

  }
  function applyPresetSplit(presetName){
    // Presets are singletons: picking one you've already started just reactivates it (with
    // whatever edits you made), instead of stacking a fresh duplicate on top of it.
    var existing = state.workout.splits.filter(function(s){ return s.name===presetName && !s.isCustom; })[0];
    if(existing){
      state.workout.activeSplitId = existing.id;
      render(); persist();
      showToast("🏋️","Split activated","\""+existing.name+"\" is now your active split.");
      return;
    }
    var preset = SPLIT_PRESETS.filter(function(p){ return p.name===presetName; })[0];
    if(!preset) return;
    var days = WEEKDAYS.map(function(wd, i){
      var tIdx = preset.schedule[i];
      if(tIdx===null || tIdx===undefined) return { weekday:wd, rest:true, workouts:[] };
      var tmpl = preset.templates[tIdx];
      return { weekday:wd, rest:false, workouts:[{ id:"wk_"+uid().slice(0,8), name:tmpl.name, exercises:tmpl.exercises.map(function(e){ return {name:e.name, sets:e.sets, reps:e.reps}; }) }] };
    });
    var split = { id:"split_"+uid().slice(0,8), name:preset.name, days:days, isCustom:false };
    state.workout.splits.push(split);
    state.workout.activeSplitId = split.id;
    render(); persist();
    showToast("🏋️","Split activated","\""+split.name+"\" is now your active split.");
  }
  function uniqueSplitName(base){
    var existing = state.workout.splits.map(function(s){ return s.name; });
    if(existing.indexOf(base)===-1) return base;
    var n = 2;
    while(existing.indexOf(base+" "+n)!==-1){ n++; }
    return base+" "+n;
  }
  function createCustomSplit(rawName){

    state.workout.splits.push(split);

  function addWorkoutToDay(splitId, weekday, name){
    var split = findSplit(splitId); if(!split) return;

  function deleteWorkout(splitId, weekday, workoutId){
    var split = findSplit(splitId); if(!split) return;

  function addExerciseManual(splitId, weekday, workoutId, name, sets, reps, weight, toFailure){
    var split = findSplit(splitId); if(!split) return;
    var day = findDay(split, weekday); if(!day) return;
    var wk = findWorkoutById(day, workoutId);
    if(!wk || !name) return;
    wk.exercises.push({
      name:name, sets:Math.max(1,parseInt(sets,10)||3), reps:(reps||"8-12").toString().slice(0,20),
      weight:(weight||"").toString().trim().slice(0,20), toFailure:!!toFailure
    });
    render(); persist();
  }
  function normalizeExercise(ex){
    ex = ex || {};
    return {
      name: String(ex.name||"Exercise").slice(0,60),

  var customExerciseLoading = null;

  function addCustomExerciseText(splitId, weekday, workoutId, rawText){
    rawText = (rawText||"").trim();
    if(!rawText) return;
    var split = findSplit(splitId); if(!split) return;
    var day = findDay(split, weekday); if(!day) return;
    var wk = findWorkoutById(day, workoutId); if(!wk) return;
    if(!sampleCap){
      wk.exercises.push({ name:rawText.slice(0,60), sets:3, reps:"8-12" });
      render(); persist();
      return;
    }
    customExerciseLoading = workoutId;
    render();
    var prompt = "The user typed this custom exercise into a workout app: \"" + rawText + "\". Interpret it as a "
      + "real gym exercise. Reply with ONLY a JSON object, no other text: "
      + '{"name": string, "sets": number, "reps": string}. '
      + "name should be a clean, properly capitalized exercise name (fix obvious typos, expand abbreviations). "
      + "If sets/reps aren't specified, use reasonable defaults (compound lifts: 3-4 sets of 6-8; isolation: 3 sets of 10-15).";
    sampleCap.json(prompt, {modelTier:"quick"}).then(function(data){
      customExerciseLoading = null;
      data = data || {};
      wk.exercises.push({ name:String(data.name||rawText).slice(0,60), sets:Math.max(1,parseInt(data.sets,10)||3), reps:(data.reps||"8-12").toString().slice(0,20) });
      render(); persist();
    }).catch(function(){
      customExerciseLoading = null;
      wk.exercises.push({ name:rawText.slice(0,60), sets:3, reps:"8-12" });
      render(); persist();
    });

  function removeExercise(splitId, weekday, workoutId, idx){
    var split = findSplit(splitId); if(!split) return;

    wk.exercises.splice(idx,1);

  function markWorkoutComplete(splitId, weekday, workoutId){
    var split = findSplit(splitId); if(!split) return;
    var day = findDay(split, weekday); if(!day) return;
    var wk = findWorkoutById(day, workoutId); if(!wk) return;
    var fitnessXp = clamp(10 + wk.exercises.length*4, 10, 45);
    var disciplineXp = 15;
    var rewards = {}; var events = [];
    var fit = statById("fitness");
    if(fit){ rewards.fitness = fitnessXp; addXp(fit, fitnessXp, fitnessSubstatWeights(wk.exercises)).forEach(function(e){ events.push({stat:fit, level:e.level, newTitle:e.newTitle}); }); }
    var disc = statById("discipline");
    if(disc){ rewards.discipline = disciplineXp; addXp(disc, disciplineXp, biasedWeights(disc, ["Follow-Through","Willpower"], 0.75)).forEach(function(e){ events.push({stat:disc, level:e.level, newTitle:e.newTitle}); }); }
    addLogEntry("🏋️ Completed " + wk.name + " (" + split.name + " · " + weekday + ")", rewards);
    render(); persist();
    flashStatIds(Object.keys(rewards));
    events.forEach(function(e){ queueLevelToast(e.stat, e.level, e.newTitle); });

    var day = findDay(split, weekday); if(!day) return;
    var wk = findWorkoutById(day, workoutId); if(!wk) return;

    var prompt = "You are a strength coach inside a fitness app. Suggest an optimal set of exercises for this workout.\n"
      + "Split: \"" + split.name + "\". Day: " + weekday + ". Workout name: \"" + wk.name + "\". Exercises already included: " + existing + ".\n"
      + "User: " + (p.sex||"unknown") + ", age " + p.age + ", activity level " + (ACTIVITY_LABELS[p.activity]||p.activity) + ", goal " + (GOAL_LABELS[p.goal]||p.goal) + ".\n"

      list.forEach(function(it){

  function completeCalendarEvent(id){
    var ev = state.calendar.events.filter(function(e){ return e.id===id; })[0];
    if(!ev || ev.done) return;
    ev.done = true;
    var rewards = {}; var events = [];
    var prod = statById("productivity");
    if(prod){ rewards.productivity = 20; addXp(prod, 20, ev.title).forEach(function(e){ events.push({stat:prod, level:e.level, newTitle:e.newTitle}); }); }
    var disc = statById("discipline");
    if(disc){ rewards.discipline = 10; addXp(disc, 10, biasedWeights(disc, ["Follow-Through"], 0.75)).forEach(function(e){ events.push({stat:disc, level:e.level, newTitle:e.newTitle}); }); }
    addLogEntry("📅 Completed \""+ev.title+"\"", rewards);

    events.forEach(function(e){ queueLevelToast(e.stat, e.level, e.newTitle); });

  function findTimetableDay(weekday){
    return state.calendar.timetable.filter(function(d){ return d.weekday===weekday; })[0];
  }
  function addTimetableBlock(weekday, title, start, end, location){
    title = (title||"").trim();
    if(!title) return;
    var day = findTimetableDay(weekday);
    if(!day) return;
    day.blocks.push({ id:"blk_"+uid().slice(0,8), title:title.slice(0,60), start:(start||"").slice(0,10), end:(end||"").slice(0,10), location:(location||"").trim().slice(0,60) });
    day.blocks.sort(function(a,b){ return (a.start||"").localeCompare(b.start||""); });
    render(); persist();
  }
  function removeTimetableBlock(weekday, blockId){
    var day = findTimetableDay(weekday);
    if(!day) return;
    day.blocks = day.blocks.filter(function(b){ return b.id!==blockId; });
    render(); persist();
  }
  function formatCalDate(dateStr){
    try{ return new Date(dateStr+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
    catch(e){ return dateStr; }
  }
  function formatCalTime(t){
    if(!t) return "";
    var parts = String(t).split(":");
    if(parts.length<2) return t;
    var h = parseInt(parts[0],10), m = parts[1];
    if(isNaN(h)) return t;
    var ap = h>=12 ? "pm" : "am";
    h = h%12; if(h===0) h=12;
    return h+":"+m+ap;
  }

        return "Added \""+String(input.title).trim()+"\" to "+input.weekday+(input.start?(" at "+input.start):"")+".";
