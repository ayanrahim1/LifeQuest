    {
      name:"remove_timetable_block", description:"Remove a block from the timetable by weekday and title (case-insensitive substring match). Call list_timetable first if unsure of the exact title.",
      inputSchema:{ type:"object", properties:{ weekday:{type:"string", enum:WEEKDAYS}, title:{type:"string"} }, required:["weekday","title"] },

        if(!match) throw new Error("No block matches '"+input.title+"' on "+input.weekday+". Blocks that day: " + (day.blocks.map(function(b){return b.title;}).join(", ")||"none"));
        removeTimetableBlock(input.weekday, match.id);
        return "Removed \""+match.title+"\" from "+input.weekday+".";
      }

  var CHAT_TYPE_CHARS_PER_SEC = 55;
  var chatTypeRevealed = 0;
  var chatTypeRAF = null;
  function startChatTypewriter(){
    chatTypeRevealed = 0;
    if(chatTypeRAF) cancelAnimationFrame(chatTypeRAF);
    var lastTs = null;
    function tick(ts){
      if(lastTs===null) lastTs = ts;
      var dt = ts - lastTs;
      lastTs = ts;
      var last = state.chat.history[state.chat.history.length-1];
      var target = (last && last.role==="assistant") ? last.content.length : 0;
      if(chatTypeRevealed < target){
        chatTypeRevealed = Math.min(target, chatTypeRevealed + Math.max(1, Math.round(CHAT_TYPE_CHARS_PER_SEC*dt/1000)));
        renderChatLogOnly();
      }
      if(chatLoading || chatTypeRevealed < target){ chatTypeRAF = requestAnimationFrame(tick); }
      else { chatTypeRAF = null; }
    }
    chatTypeRAF = requestAnimationFrame(tick);
  }
  function stopChatTypewriter(){
    if(chatTypeRAF){ cancelAnimationFrame(chatTypeRAF); chatTypeRAF = null; }

  function sendChatMessage(text){

  function performChatCall(withTools){
    var turns = [{role:"user", content:chatContextPrefix(withTools)}].concat(state.chat.history.slice(0,-1));
    chatAbort = new AbortController();
    var opts = {
      modelTier:"default",
      signal: chatAbort.signal,
      onText: function(update){
        var last = state.chat.history[state.chat.history.length-1];
        if(last && last.role==="assistant"){ last.content = update.text; renderChatLogOnly(); }
      }
    };
    if(withTools){
      var toolList = ADMIN_TOOLS;
      if(sampleLimits && sampleLimits.tools && sampleLimits.tools.maxCount){ toolList = ADMIN_TOOLS.slice(0, sampleLimits.tools.maxCount); }
      opts.tools = toolList;
    }
    sampleCap(turns, opts).then(function(res){
      chatToolsSupported = withTools ? true : chatToolsSupported;
      chatLoading = false; chatAbort = null;
      var last = state.chat.history[state.chat.history.length-1];
      if(last && last.role==="assistant"){ last.content = res.text; }
      trimChatHistory();
      render(); persist();
    }).catch(function(err){
      // tools_unavailable = this view can't run tools at all; invalid_request while tools were
      // attached most often means the API rejected the tool definitions themselves. Either way,
      // the safe recovery is the same: drop tools and retry as a plain conversation.
      if(withTools && err && (err.code==="tools_unavailable" || err.code==="invalid_request")){
        var firstTimeLearningThis = chatToolsSupported===null;
        chatToolsSupported = false;
        if(firstTimeLearningThis){
          showToast("💬","Chat-only mode","This view can't run direct app actions right now, but AI can still chat and answer anything.");
        }
        performChatCall(false);
        return;
      }
      chatLoading = false; chatAbort = null;
      var last = state.chat.history[state.chat.history.length-1];
      if(err && err.code==="cancelled"){
        if(last && last.role==="assistant" && !last.content){ state.chat.history.pop(); state.chat.history.pop(); }
        render();
        return;
      }
      if(last && last.role==="assistant"){
        if(err && err.text){ last.content = err.text; } else { state.chat.history.pop(); }
      }
      chatError = errorCopy(err) || "Something went wrong — try again.";
      render();
    });
  }

  function generateQuestsForStat(stat){
    if(!sampleCap) return;
    var prompt = "You are designing content for an RPG-style habit tracking app. The user just added a new stat "
      + "called \"" + stat.name + "\".\n1) Suggest 4 short sub-attribute names it could be broken into, like a skill "
      + "breakdown (for example \"Fitness\" might break into Strength, Endurance, Mobility, Recovery).\n"
      + "2) Suggest 5 varied, concrete, achievable quests (habits or tasks) that would help someone build this stat, "
      + "each clearly about exactly ONE of those 4 sub-attributes — reference it by its 0-based index in your substats list.\n"
      + 'Reply with ONLY a JSON object, no other text: {"substats": [string, string, string, string], "quests": '
      + '[{"name": string, "icon": string (one emoji), "freq": "daily"|"repeatable"|"once", "amount": number (10-30), '
      + '"subIndex": number (0-3, index into substats above)}]}.';
    sampleCap.json(prompt, {modelTier:"quick"}).then(function(data){

      if(subNames.length===4){

  function queueLevelToast(stat, level, newTitle){ pendingToasts.push({stat:stat, level:level, newTitle:newTitle}); }
  function flushToasts(){
    if(!pendingToasts.length) return;
    var byStat = {};
    pendingToasts.forEach(function(t){
      byStat[t.stat.id] = byStat[t.stat.id] || { stat:t.stat, count:0, level:0, title:null };
      byStat[t.stat.id].count++;
      byStat[t.stat.id].level = t.level;
      if(t.newTitle) byStat[t.stat.id].title = t.newTitle;
    });
    Object.keys(byStat).forEach(function(k){
      var b = byStat[k];
      var head = b.count > 1 ? ("LEVEL UP ×" + b.count) : "LEVEL UP";
      var body = b.stat.icon + " " + b.stat.name + " → Lv. " + b.level + (b.title ? "  •  \"" + b.title + "\" unlocked" : "");
      showToast("⭐", head, body);

  function showToast(icon, title, body){
    var wrap = document.getElementById("toastWrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<div class="ic">'+icon+'</div><div><div class="t1">'+escapeHtml(title)+'</div><div class="t2">'+escapeHtml(body)+'</div></div>';
    wrap.appendChild(el);
    setTimeout(function(){ el.style.transition="opacity .4s"; el.style.opacity="0"; setTimeout(function(){ el.remove(); }, 400); }, 4200);
  }

  function flashStat(rewards){ flashStatIds(Object.keys(rewards)); }
  function flashStatIds(ids){
    ids.forEach(function(id){
      var card = document.querySelector('[data-stat-card="'+id+'"]');
      if(card){ card.classList.add("flash"); setTimeout(function(){ card.classList.remove("flash"); }, 700); }
    });

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // Chat inputs are <textarea>s that grow downward as a message wraps onto more lines, instead
  // of a single-line <input> scrolling its text sideways out of view. Capped so a huge paste
  // doesn't take over the screen — past that it scrolls internally like a normal textarea.
  var CHAT_TEXTAREA_MAX_PX = 160;
  function autoGrowTextarea(el){
    if(!el) return;
    el.style.height = "auto";
    var full = el.scrollHeight;
    el.style.height = Math.min(full, CHAT_TEXTAREA_MAX_PX) + "px";
    el.style.overflowY = full > CHAT_TEXTAREA_MAX_PX ? "auto" : "hidden";
  }
  // Enter sends (matching a normal chat box); Shift+Enter inserts a line break instead.
  function bindChatTextarea(el, onSend){
    if(!el) return;
    autoGrowTextarea(el);
    el.addEventListener("input", function(){ autoGrowTextarea(el); });
    el.addEventListener("keydown", function(ev){
      if(ev.key==="Enter" && !ev.shiftKey){
        ev.preventDefault();
        var v = el.value;
        el.value = "";
        autoGrowTextarea(el);
        onSend(v);
      }
    });
  }

  /* ===================== RENDER ===================== */
  var activeTab = "status";
  var TAB_ORDER = ["status","quests","calendar","track","recipes","workout","chat","settings"];

  function renderRewardPills(rewards){
    return Object.keys(rewards).map(function(id){
      var s = statById(id);
      if(!s) return "";
      var amt = rewards[id];
      var neg = amt < 0;
      var pillColor = neg ? "var(--danger)" : s.color;
      return '<span class="reward-pill" style="--pill-color:'+pillColor+'">'+(neg?"-":"+")+Math.abs(amt)+' '+escapeHtml(s.icon)+' '+escapeHtml(s.name)+'</span>';
    }).join("");
  }

  // Progress bars are recreated fresh on every render (innerHTML replace), so a CSS width
  // transition alone never animates — the element never existed at the old width. Instead we
  // remember each bar's last-rendered % by a stable key, paint it at that old value, then a
  // double-rAF nudges it to the new value so the transition has a real "from" state to animate.
  var barPrevWidths = {};
  function animatedBar(key, pct, styleExtra){
    pct = clamp(Math.round(pct), 0, 100);
    var prev = barPrevWidths.hasOwnProperty(key) ? barPrevWidths[key] : pct;
    barPrevWidths[key] = pct;
    return '<div class="xp-bar-track"><div class="xp-bar-fill" data-target="'+pct+'" style="width:'+prev+'%;'+(styleExtra||'')+'"></div></div>';
  }
  function animateBars(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.querySelectorAll('.xp-bar-fill[data-target]').forEach(function(el){
          el.style.width = el.getAttribute('data-target') + '%';
        });
      });
    });
  }

    var gGroup = gradeGroup(overall.level);
    return ''
    + '<div class="wordmark">'
    +   '<div class="wordmark-left">'
    +     '<div class="logo-badge">LQ</div>'
    +     '<div><h1>LifeQuest</h1><div class="tag">Your life, leveled up</div></div>'
    +   '</div>'
    + '</div>'
    + '<div class="panel status-plate">'
    +   '<div class="orb"><div class="lv-label">Level</div><div class="lv-num">'+overall.level+'</div></div>'
    +   '<div class="status-main">'

    +       '<span class="grade-badge g-'+gGroup+'">'+gradeLabel(overall.level)+'</span>'

  function renderQuestBoard(){
    if(!state.stats.length) return "";

    // Top level: full-width category bars (Daily + one per stat), same visual language as Status.
    if(!selectedQuestCategory){
      var bars = '<button class="category-bar" type="button" data-select-quest-cat="daily" style="--tile-color:#d9b45c"><span class="ic">☀️</span><span class="lbl">Daily</span><span class="chev">›</span></button>'

          }).join("");

        + '<div class="section-h">Quest Board</div>'

        + '<div class="category-bar-list">'+bars+'</div>'
        + '</div>';
    }

    var cat = selectedQuestCategory;
    var isDaily = cat==="daily";
    var catStat = isDaily ? null : statById(cat);

    var color = isDaily ? "#d9b45c" : catStat.color;

    // Active quests that belong in this category: daily quests go under Daily regardless of
    // stat; repeatable/once quests show under every stat they reward.
    var activeList = isDaily
      ? state.quests.filter(function(q){ return q.freq==="daily"; })
      : state.quests.filter(function(q){ return q.freq!=="daily" && q.rewards.hasOwnProperty(cat); });
    var activeHtml = activeList.length
      ? ('<div class="section-h">Your Quests</div>' + activeList.map(function(q){ return renderQuestRow(q); }).join(""))
      : '<div class="quest-empty">No active quests here yet — add one from the catalog below.</div>';

    var catalogHtml = catalog.length
      ? ('<div class="section-h" style="margin-top:16px">Catalog</div>' + catalog.map(function(item){

      : '<div class="quest-empty" style="margin-top:16px">No preset quests here yet — generate some with AI.</div>';

    else { genBtn = '<button class="btn-secondary" data-gen-quests="'+cat+'" style="margin-top:10px" '+(genLoading?'disabled':'')+'>'+(genLoading?'Thinking…':'🤖 Generate More Quests')+'</button>'; }

      +   '<span style="font-family:var(--font-display);font-weight:700;font-size:15px;color:'+color+'">'+escapeHtml(label)+'</span>'
      + '</div>'
      + activeHtml
      + catalogHtml
      + genBtn
      + '</div>';
  }

  var calendarView = "calendar"; // "calendar" | "timetable"

  function renderCalendarEventRow(ev){

  /* ----- Month calendar grid ----- */
  function displayedMonthDate(){
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + calMonthOffset);
    return d;
  }
  function eventsByDate(){
    var map = {};
    state.calendar.events.forEach(function(e){ (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }
  function renderMonthGrid(){
    var base = displayedMonthDate();
    var year = base.getFullYear(), month = base.getMonth();
    var monthLabel = base.toLocaleDateString(undefined, {month:"long", year:"numeric"});
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = todayStr();
    var byDate = eventsByDate();

    var cells = "";
    for(var i=0;i<firstDow;i++){ cells += '<div class="cal-cell empty"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dateStr = year+"-"+pad2(month+1)+"-"+pad2(day);
      var dayEvents = byDate[dateStr] || [];
      var isToday = dateStr===today;
      var isSelected = dateStr===selectedCalendarDate;
      var dots = dayEvents.slice(0,4).map(function(e){
        var c = e.done ? "var(--steel)" : (e.category==="event" ? "#52b8c4" : "#d99a4e");
        return '<span class="cal-dot" style="background:'+c+'"></span>';
      }).join("");
      var overflow = dayEvents.length>4 ? '<span class="cal-more">+'+(dayEvents.length-4)+'</span>' : "";
      cells += '<button class="cal-cell'+(isToday?' today':'')+(isSelected?' selected':'')+(dayEvents.length?' has-events':'')+'" type="button" data-select-cal-date="'+dateStr+'">'
        + '<span class="cal-daynum">'+day+'</span>'
        + '<span class="cal-dots">'+dots+overflow+'</span>'
        + '</button>';
    }
    var dowHeader = WEEKDAYS.map(function(wd){ return '<div class="cal-dow">'+wd.slice(0,3)+'</div>'; }).join("");
    return '<div class="panel">'
      + '<div class="cal-month-head">'
      +   '<button class="btn-secondary" data-cal-month="-1" type="button">‹</button>'
      +   '<div class="cal-month-label">'+monthLabel+'</div>'
      +   '<button class="btn-secondary" data-cal-month="1" type="button">›</button>'
      + '</div>'
      + '<div class="cal-grid cal-dow-row">'+dowHeader+'</div>'
      + '<div class="cal-grid">'+cells+'</div>'
      + '</div>';
  }
  function renderCalendarDayDetail(){
    if(selectedCalendarDate){
      var byDate = eventsByDate();
      var dayEvents = (byDate[selectedCalendarDate]||[]).sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); });
      var label;
      try{ label = new Date(selectedCalendarDate+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }catch(e){ label = selectedCalendarDate; }
      return '<div class="panel">'
        + '<div class="section-h" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'

        + '</div>'
        + (dayEvents.length ? dayEvents.map(renderCalendarEventRow).join("") : '<div class="quest-empty">Nothing on this day.</div>')
        + '</div>';
    }
    var upcoming = state.calendar.events.filter(function(e){ return !e.done; }).sort(function(a,b){
      var ka = a.date+(a.time||"00:00"), kb = b.date+(b.time||"00:00");
      return ka<kb ? -1 : (ka>kb ? 1 : 0);
    });
    return '<div class="panel"><div class="section-h">Upcoming</div>'
      + (upcoming.length ? upcoming.map(renderCalendarEventRow).join("") : '<div class="quest-empty">Nothing on the calendar yet.</div>')
      + '</div>';

  /* ----- Weekly timetable grid ----- */
  var TIMETABLE_DEFAULT_START = 6, TIMETABLE_DEFAULT_END = 22;
  function timeToMinutes(t){
    if(!t) return null;
    var parts = String(t).split(":");
    var h = parseInt(parts[0],10), m = parseInt(parts[1],10)||0;
    if(isNaN(h)) return null;
    return h*60+m;
  }
  function timetableRange(){
    var startH = TIMETABLE_DEFAULT_START, endH = TIMETABLE_DEFAULT_END;
    state.calendar.timetable.forEach(function(d){
      d.blocks.forEach(function(b){
        var s = timeToMinutes(b.start), e = timeToMinutes(b.end);
        if(s!=null) startH = Math.min(startH, Math.floor(s/60));
        if(e!=null) endH = Math.max(endH, Math.ceil(e/60));
        else if(s!=null) endH = Math.max(endH, Math.ceil(s/60)+1);
      });
    });
    return { startH:startH, endH:Math.max(endH, startH+1) };
  }
  function renderTimetableGrid(){
    var range = timetableRange();
    var HOUR_PX = 48;
    var totalPx = (range.endH - range.startH) * HOUR_PX;
    var hourLabels = "";
    for(var h=range.startH; h<=range.endH; h++){
      var top = (h-range.startH)*HOUR_PX;
      var hr = h%24;
      var label = (hr%12===0?12:hr%12) + (hr<12?"am":"pm");
      hourLabels += '<div class="tt-hour-label" style="top:'+top+'px">'+label+'</div>';
    }
    var dayCols = WEEKDAYS.map(function(wd){
      var day = findTimetableDay(wd) || {weekday:wd, blocks:[]};
      var timed = day.blocks.filter(function(b){ return timeToMinutes(b.start)!=null; });
      var unscheduled = day.blocks.filter(function(b){ return timeToMinutes(b.start)==null; });
      var blocksHtml = timed.map(function(b){
        var s = timeToMinutes(b.start);
        var e = timeToMinutes(b.end);
        if(e==null || e<=s) e = s+60;
        var top = ((s - range.startH*60)/60)*HOUR_PX;
        var height = Math.max(28, ((e-s)/60)*HOUR_PX - 2);
        return '<div class="tt-block" style="top:'+top+'px;height:'+height+'px" data-remove-block="'+wd+'|'+b.id+'" title="Tap to remove">'
          + '<div class="tt-block-title">'+escapeHtml(b.title)+'</div>'
          + (b.location?'<div class="tt-block-loc">'+escapeHtml(b.location)+'</div>':'')
          + '</div>';
      }).join("");
      var unscheduledHtml = unscheduled.length ? ('<div class="tt-unscheduled">'+unscheduled.map(function(b){
        return '<span class="tt-chip" data-remove-block="'+wd+'|'+b.id+'" title="Tap to remove">'+escapeHtml(b.title)+'</span>';
      }).join("")+'</div>') : '';
      return '<div class="tt-day-col">'
        + '<div class="tt-day-head">'+wd.slice(0,3)+'</div>'
        + '<div class="tt-day-body" style="height:'+totalPx+'px">'+blocksHtml+'</div>'
        + unscheduledHtml
        + '</div>';
    }).join("");
    return '<div class="panel">'
      + '<div class="section-h">Weekly Timetable</div>'
      + '<div class="tt-scroll"><div class="tt-grid">'
      +   '<div class="tt-time-col"><div class="tt-day-head"></div><div class="tt-time-body" style="height:'+totalPx+'px">'+hourLabels+'</div></div>'
      +   dayCols
      + '</div></div>'
      + '</div>';
  }

  // Rings are drawn as plain SVG stroke-dasharray arcs — no animation-on-change like the bar
  // components get (animatedBar's old->new trick doesn't translate cleanly to arc geometry),
  // just a fresh accurate arc every render.
  function ringCenterText(cx, cy, lines){
    return lines.map(function(l){
      return '<text x="'+cx+'" y="'+(cy+l.dy)+'" text-anchor="middle" font-size="'+l.size+'" fill="'+l.color+'" font-weight="'+(l.weight||600)+'" font-family="var(--font-mono)">'+escapeHtml(l.text)+'</text>';
    }).join("");
  }
  function ringSvg(size, sw, pct, color, centerLines){
    var cx = size/2, cy = size/2, r = (size-sw)/2;
    var c = 2*Math.PI*r;
    var dash = (clamp(pct,0,100)/100) * c;
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border-soft)" stroke-width="'+sw+'"></circle>'
      + (dash>0 ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(2)+' 999" transform="rotate(-90 '+cx+' '+cy+')"></circle>' : '')
      + ringCenterText(cx, cy, centerLines)
      + '</svg>';
  }
  function calorieRing(value, target){
    var pct = target>0 ? (value/target)*100 : 0;
    var over = target>0 && value>target;
    var color = over ? "#e2643b" : "#d9b45c";
    var svg = ringSvg(150, 15, pct, color, [
      {text:String(Math.round(value)), dy:-2, size:30, color:"var(--parchment)", weight:800},
      {text:(target?("/ "+target+" cal"):"cal"), dy:20, size:12, color:"var(--parchment-dim)", weight:600}
    ]);
    var pctLabel = target>0 ? (Math.round(pct)+"% of goal") : "";
    return '<div class="ring-item calorie-ring">'+svg+'<div class="ring-label">Calories</div>'+(pctLabel?'<div class="ring-sub muted" style="color:'+color+'">'+pctLabel+'</div>':'')+'</div>';
  }
  function macroRing(label, value, target, color, unit){
    var pct = target>0 ? (value/target)*100 : 0;
    var svg = ringSvg(84, 9, pct, color, [{text:Math.round(pct)+"%", dy:5, size:16, color:"var(--parchment)", weight:700}]);
    return '<div class="ring-item">'+svg+'<div class="ring-label">'+label+'</div><div class="ring-sub muted">'+Math.round(value)+' / '+target+unit+'</div></div>';
  }
  function macroSplitSegments(protein, carbs, fat){
    return [
      {label:"Protein", val:Math.max(0,protein)*4, color:"#e2643b"},
      {label:"Carbs", val:Math.max(0,carbs)*4, color:"#52b8c4"},
      {label:"Fat", val:Math.max(0,fat)*9, color:"#9b7fd4"}
    ];
  }
  function macroSplitBarHtml(protein, carbs, fat){
    var segs = macroSplitSegments(protein, carbs, fat);
    var total = segs.reduce(function(s,x){ return s+x.val; }, 0);
    if(total<=0) return "";
    var bar = segs.map(function(seg){
      var pct = (seg.val/total)*100;
      return pct>0.3 ? '<span style="width:'+pct.toFixed(1)+'%;background:'+seg.color+'"></span>' : '';
    }).join("");
    var pctText = segs.map(function(seg){ return Math.round(seg.val/total*100)+"% "+seg.label.charAt(0); }).join(" · ");
    return '<div class="macro-split-bar">'+bar+'</div><div class="macro-split-pct muted">'+pctText+'</div>';
  }
  function calorieGoalPctText(calories){
    var target = state.settings.calorieTarget;
    if(!target) return "";
    return " · "+Math.round((calories/target)*100)+"% of daily goal";
  }
  function calorieTrendChart(dates, history, target){
    var ordered = dates.slice().reverse();
    if(ordered.length<2) return "";
    var vals = ordered.map(function(d){ return (history[d]&&history[d].calories)||0; });
    var max = Math.max(target||0, vals.reduce(function(a,b){ return Math.max(a,b); }, 0), 1);
    var w = 280, h = 64, gap = 6, n = ordered.length;
    var barW = (w - gap*(n-1)) / n;
    var bars = ordered.map(function(d, i){
      var v = (history[d]&&history[d].calories)||0;
      var barH = Math.max(2, (v/max)*h);
      var x = i*(barW+gap);
      var y = h - barH;
      var over = target>0 && v>target;
      var color = over ? "#e2643b" : "#d9b45c";
      var lbl; try{ lbl = new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"narrow"}); }catch(e){ lbl = ""; }
      return { rect:'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" fill="'+color+'" rx="2"></rect>', x:x, lbl:lbl };
    });
    var targetY = target>0 ? (h-(clamp(target/max,0,1)*h)) : null;
    var targetLine = targetY!==null ? '<line x1="0" y1="'+targetY.toFixed(1)+'" x2="'+w+'" y2="'+targetY.toFixed(1)+'" stroke="var(--parchment-dim)" stroke-width="1" stroke-dasharray="3 3"></line>' : "";
    var labels = bars.map(function(b){ return '<text x="'+(b.x+barW/2).toFixed(1)+'" y="'+(h+13)+'" text-anchor="middle" font-size="9" fill="var(--parchment-dim)" font-family="var(--font-mono)">'+b.lbl+'</text>'; }).join("");
    return '<div class="trend-chart-wrap"><svg width="'+w+'" height="'+(h+16)+'" viewBox="0 0 '+w+' '+(h+16)+'">'+targetLine+bars.map(function(b){ return b.rect; }).join("")+labels+'</svg></div>';
  }

  // Tracks which "view" was on screen last render, so an enter-animation only plays when the
  // visible section actually changes (tab switch, or drilling into/out of a detail view) —
  // never on an in-place update like completing a quest or a bar filling in.
  var lastRenderedViewKey = null;
  function currentViewKey(){
    if(!state.profile.onboarded) return "onboarding";
    var key = activeTab;
    if(activeTab==="status" && selectedStatDetail) key += ":" + selectedStatDetail;
    if(activeTab==="quests" && selectedQuestCategory) key += ":" + selectedQuestCategory;
    if(activeTab==="calendar") key += ":" + calendarView;
    return key;
  }

  // The whole app re-renders by replacing app.innerHTML from scratch, which destroys and
  // recreates every DOM node — including whatever text input the viewer is mid-typing into,
  // if some unrelated async event (a food-analysis result, a toast, another tab's action)
  // happens to trigger a render while they're typing. Snapshot the focused input's id/value/
  // cursor before the rebuild and restore it after, so an in-progress keystroke never vanishes
  // under them just because something else changed state at the same time.
  function captureFocus(container){
    var el = document.activeElement;
    if(!el || !el.id || !container.contains(el)) return null;
    if(el.tagName!=="INPUT" && el.tagName!=="TEXTAREA") return null;
    var info = { id: el.id, value: el.value };
    if(typeof el.selectionStart === "number"){ info.start = el.selectionStart; info.end = el.selectionEnd; }
    return info;
  }
  function restoreFocus(info){
    if(!info) return;
    var el = document.getElementById(info.id);
    if(!el || (el.tagName!=="INPUT" && el.tagName!=="TEXTAREA")) return;
    el.value = info.value;
    el.focus();
    if(info.start!=null && typeof el.setSelectionRange==="function"){
      try{ el.setSelectionRange(info.start, info.end); }catch(e){}
    }
    if(el.tagName==="TEXTAREA") autoGrowTextarea(el);
  }

  function render(){
    var app = document.getElementById("app");
    var focusInfo = captureFocus(app);
    // A full innerHTML rebuild can otherwise reset the page's scroll position — most visibly on
    // mobile when a render happens to coincide with the keyboard closing. Snapshot it and restore
    // it below whenever this render isn't an actual navigation to a different section.
    var scrollY = window.scrollY;
    var prevViewKey = lastRenderedViewKey;

    if(!state.profile.onboarded){
      app.innerHTML = renderOnboarding();
      bindEvents();
      restoreFocus(focusInfo);
      lastRenderedViewKey = "onboarding";
      return;
    }

    app.innerHTML = renderHeader() + renderTabs()
      + '<div class="tab-panels-viewport" id="panelsViewport">'
      + renderStatusTab() + renderQuestsTab() + renderCalendarTab() + renderTrackTab() + renderRecipeTab() + renderWorkoutTab() + renderChatTab() + renderSettingsTab()
      + '</div>';

    ["status","quests","calendar","track","recipes","workout","chat","settings"].forEach(function(t){
      var el = document.getElementById("panel-"+t);
      if(el) el.hidden = (t !== activeTab);
    });

    bindEvents();
    animateBars();
    restoreFocus(focusInfo);

    var viewKey = currentViewKey();
    if(viewKey !== prevViewKey){
      var activePanel = document.getElementById("panel-"+activeTab);
      if(activePanel){ activePanel.classList.add("view-enter"); }
    } else {
      window.scrollTo(0, scrollY);
      requestAnimationFrame(function(){ window.scrollTo(0, scrollY); });
    }
    lastRenderedViewKey = viewKey;
  }

  /* ----- Swipe left/right between tabs: the panel follows the finger 1:1, and releasing past
     60% of the way auto-completes the switch — otherwise it springs back to where it started. ----- */
  var SWIPE_COMPLETE_THRESHOLD = 0.3;
  var swipeStartX = 0, swipeStartY = 0, swipeLocked = null, swipeActive = false;
  var swipeDragging = false, swipeDragDir = 0, swipeFromTab = null, swipeToTab = null, swipeWidth = 1;

  // Called the moment a horizontal drag is confirmed: grabs the current panel and whichever
  // neighbor the drag is heading toward, positions the neighbor just off the edge it'll enter
  // from, and switches both off CSS transitions so they can track the finger with zero lag.
  function beginSwipeDrag(dir){
    if(!state || !state.profile.onboarded) return false;
    var idx = TAB_ORDER.indexOf(activeTab);
    var next = idx + dir;
    if(idx===-1 || next<0 || next>=TAB_ORDER.length) return false;
    var viewport = document.getElementById("panelsViewport");
    var fromEl = document.getElementById("panel-"+activeTab);
    var toEl = document.getElementById("panel-"+TAB_ORDER[next]);
    if(!viewport || !fromEl || !toEl) return false;
    swipeFromTab = activeTab;
    swipeToTab = TAB_ORDER[next];
    swipeDragDir = dir;
    swipeWidth = viewport.getBoundingClientRect().width || 1;
    viewport.style.height = fromEl.offsetHeight + "px";
    viewport.classList.add("tp-active");
    fromEl.classList.add("tp-sliding");
    toEl.classList.add("tp-sliding");
    fromEl.style.transition = "none";
    toEl.style.transition = "none";
    toEl.hidden = false;
    toEl.style.transform = "translateX(" + (dir>0 ? swipeWidth : -swipeWidth) + "px)";
    fromEl.style.transform = "translateX(0px)";
    return true;
  }
  // Every touchmove while dragging: move both panels by the raw finger delta, clamped so you
  // can't drag the outgoing panel past a full screen-width off to the side it's leaving.
  function updateSwipeDrag(dx){
    var fromEl = document.getElementById("panel-"+swipeFromTab);
    var toEl = document.getElementById("panel-"+swipeToTab);
    if(!fromEl || !toEl) return;
    var w = swipeWidth;
    var clamped = swipeDragDir>0 ? Math.max(-w, Math.min(0, dx)) : Math.min(w, Math.max(0, dx));
    fromEl.style.transform = "translateX(" + clamped + "px)";
    toEl.style.transform = "translateX(" + (swipeDragDir>0 ? (w+clamped) : (-w+clamped)) + "px)";
  }
  // On release: past 60% of the viewport width, finish the drag the rest of the way into the new
  // tab; short of that, spring both panels back to where the drag started. Either way a real
  // render() only happens once the short settle transition ends, so the DOM comes back clean.
  function finishSwipeDrag(dx){
    var fromEl = document.getElementById("panel-"+swipeFromTab);
    var toEl = document.getElementById("panel-"+swipeToTab);
    var w = swipeWidth || 1;
    var complete = Math.min(1, Math.abs(dx)/w) >= SWIPE_COMPLETE_THRESHOLD;
    var toTab = swipeToTab;
    if(fromEl && toEl){
      fromEl.style.transition = "transform .22s ease";
      toEl.style.transition = "transform .22s ease";
      if(complete){
        fromEl.style.transform = "translateX(" + (swipeDragDir>0 ? -w : w) + "px)";
        toEl.style.transform = "translateX(0px)";
      } else {
        fromEl.style.transform = "translateX(0px)";
        toEl.style.transform = "translateX(" + (swipeDragDir>0 ? w : -w) + "px)";
      }
    }
    swipeDragging = false; swipeFromTab = null; swipeToTab = null; swipeDragDir = 0;
    setTimeout(function(){
      if(complete){
        activeTab = toTab;
        lastRenderedViewKey = currentViewKey(); // the drag itself already animated the change
      }
      render();
    }, 230);
  }
  function initSwipeNav(){
    var app = document.getElementById("app");
    if(!app) return;
    app.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1){ swipeActive = false; return; }
      var target = e.target;
      // Never hijack a gesture that starts on something with its own horizontal scrolling or
      // interaction (the weekly timetable, text inputs/selects, a chat log the user may be
      // selecting text in).
      if(target.closest && target.closest(".tt-scroll, input, textarea, select, .chat-log")){ swipeActive = false; return; }
      var t = e.touches[0];
      swipeStartX = t.clientX; swipeStartY = t.clientY; swipeLocked = null; swipeActive = true; swipeDragging = false;
    }, {passive:true});
    app.addEventListener("touchmove", function(e){
      if(!swipeActive) return;
      var t = e.touches[0];
      var dx = t.clientX - swipeStartX, dy = t.clientY - swipeStartY;
      if(swipeLocked===null && (Math.abs(dx)>10 || Math.abs(dy)>10)){
        swipeLocked = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
      }
      if(swipeLocked !== "h") return;
      if(!swipeDragging){
        swipeDragging = beginSwipeDrag(dx<0 ? 1 : -1);
        if(!swipeDragging){ swipeActive = false; return; }
      }
      updateSwipeDrag(dx);
    }, {passive:true});
    app.addEventListener("touchend", function(e){
      if(!swipeActive) return;
      swipeActive = false;
      if(!swipeDragging) return;
      var t = e.changedTouches[0];
      finishSwipeDrag(t.clientX - swipeStartX);
    });
    app.addEventListener("touchcancel", function(){
      swipeActive = false;
      if(swipeDragging) finishSwipeDrag(0);
    });
  }

  /* ===================== INIT ===================== */
  function boot(bootState){
    // A db document snapshot's data() is frozen (platform guarantee) — but hydrate() below writes
    // defaults directly onto the loaded stats/quests/etc. Mutating a frozen object throws
    // ("attempted to assign to readonly property" in Safari/WebKit). Deep-clone into a plain,
    // unfrozen copy first so hydrate() has something safe to write into. (loadLocal()'s output is
    // already a fresh JSON.parse, never frozen, so this is a harmless no-op on that path.)
    var safeState = bootState;
    if(bootState){
      try{ safeState = JSON.parse(JSON.stringify(bootState)); }catch(e){ safeState = bootState; }
    }
    state = hydrate(safeState);
    checkDailyConsistency();
    var elapsed = Date.now() - BOOT_STARTED_AT;
    var wait = Math.max(0, SPLASH_MIN_MS - elapsed);
    setTimeout(render, wait);
  }

  // Loading your save is the one place a transient failure must NOT be treated like a fresh
  // install: falling back to "no data" here would show onboarding again, and completing it would
  // overwrite your real save with a blank one. So this retries a couple of times with backoff, and
  // only if it truly can't reach the store does it show an honest error with a manual retry.
  var DB_LOAD_MAX_RETRIES = 3;
  // Every viewer's data/users/<their id>/ subtree is private by default with no rules needed, so
  // that's where each person's save lives. LEGACY_DOC_PATH is the single shared path this app
  // used before per-user paths existed; still checked once so a pre-existing save isn't stranded.
  var LEGACY_DOC_PATH = "state/app";
  function hasRealData(d){
    if(!d) return false;
    try{
      if(d.profile && d.profile.onboarded) return true;
      if(Array.isArray(d.stats) && d.stats.some(function(s){ return (s.totalXp||0) > 0; })) return true;
      if(Array.isArray(d.log) && d.log.length) return true;
    }catch(e){}
    return false;
  }
  function resolveUserId(userCap){
    if(!userCap) return Promise.resolve(null);
    try{
      var v = (typeof userCap.id === "function") ? userCap.id() : userCap.id;
      return Promise.resolve(v).catch(function(){ return null; });
    }catch(e){
      return Promise.resolve(null);
    }
  }
  function attemptLoadDb(attempt){
    var claudeApi = window.claude;
    Promise.all([
      Promise.resolve(claudeApi.use("db")).catch(function(){ return null; }),
      Promise.resolve(claudeApi.use("user")).catch(function(){ return null; })
    ]).then(function(res){
      var db = res[0], userCap = res[1];
      if(!db){ localOnly = true; boot(loadLocal()); return; }
      return resolveUserId(userCap).then(function(id){
        if(!id){
          docRef = db.doc(LEGACY_DOC_PATH);
          return docRef.get().then(function(snap){
            if(snap.exists){ boot(snap.data()); }
            else { boot(null); persist(); }
          });
        }
        docRef = db.doc("data/users/"+id+"/app");
        return docRef.get().then(function(snap){
          if(snap.exists){ boot(snap.data()); return; }
          return db.doc(LEGACY_DOC_PATH).get().then(function(legacySnap){
            if(legacySnap.exists && hasRealData(legacySnap.data())){
              boot(legacySnap.data());
              return persist();
            }
            boot(null);
            return persist();
          });
        });
      });
    }).catch(function(err){
      if(attempt < DB_LOAD_MAX_RETRIES){
        setTimeout(function(){ attemptLoadDb(attempt+1); }, 900*(attempt+1));
      } else {
        showLoadError(err);
      }
    });
  }
  function showLoadError(err){
    var code = (err && err.code) ? String(err.code) : "unknown";
    var msg = (err && err.message) ? String(err.message).slice(0,200) : "";
    var app = document.getElementById("app");
    app.innerHTML = '<div class="loading-screen">'
      + '<div>Couldn\'t load your save right now.</div>'
      + '<div class="muted" style="margin-top:10px;font-family:var(--font-mono);font-size:11px">code: '+escapeHtml(code)+(msg?('<br>'+escapeHtml(msg)):'')+'</div>'
      + '<div class="muted" style="margin-top:10px;font-family:var(--font-body);font-size:13px">This is usually a temporary connection issue. Your saved progress is untouched — try again, or fully close and reopen this page.</div>'
      + '<button class="btn-primary" id="retryLoadBtn" style="margin-top:16px">Try Again</button>'
      + '</div>';
    var btn = document.getElementById("retryLoadBtn");
    if(btn) btn.addEventListener("click", function(){
      app.innerHTML = '<div class="splash"><div class="splash-badge">LQ</div><h1 class="splash-title">LifeQuest</h1><div class="splash-tag">Your life, leveled up</div></div>';
      BOOT_STARTED_AT = Date.now();
      attemptLoadDb(0);
    });
  }

  function init(){
    initSwipeNav();
    var claudeApi = window.claude;
    if(!claudeApi || !claudeApi.use){
      localOnly = true;
      boot(loadLocal());
      return;
    }
    Promise.resolve(claudeApi.use("downloads")).then(function(cap){ downloadsCap = cap; }).catch(function(){});
    Promise.resolve(claudeApi.use("sample")).then(function(cap){
      sampleCap = cap;
      if(cap && cap.limits){
        cap.limits().then(function(l){ sampleLimits = l; if(state) render(); }).catch(function(){});
      }
      if(state) render();
    }).catch(function(){});
